name: MAWS gate setup
description: >-
  The shared setup of .github/workflows/gate.yml (docs/doperpowers/plans/2026-10-14-gate-offload.md §3.2), run after
  the checkout: pnpm from packageManager, Node 22 with the pnpm store cached, Electron's download cached by its version,
  the frozen install; on a Linux runner, for an e2e job the virtual display, the CJK fonts and Electron's sandbox, and
  LibreOffice for the groups that render documents through it.
inputs:
  e2e:
    description: Install xvfb and the CJK fonts, and lift the apparmor restriction on unprivileged user namespaces.
    default: 'false'
  libreoffice:
    description: Install LibreOffice Writer and Impress.
    default: 'false'
  apt:
    description: More apt packages for a Linux runner, space-separated.
    default: ''
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm
    - id: electron
      shell: bash
      run: echo "version=$(node -p "require('./package.json').devDependencies.electron")" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: ${{ runner.os == 'macOS' && '~/Library/Caches/electron' || '~/.cache/electron' }}
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron.outputs.version }}
    # The Linux packages; a macOS runner carries its display and fonts, and LibreOffice there is the machine's own.
    - if: runner.os == 'Linux' && (inputs.e2e == 'true' || inputs.libreoffice == 'true' || inputs.apt != '')
      shell: bash
      env:
        E2E: ${{ inputs.e2e }}
        LIBREOFFICE: ${{ inputs.libreoffice }}
        APT: ${{ inputs.apt }}
      run: |
        read -ra packages <<<"$APT"
        # Korean text, and the faces the UI tokens name after the Mac's own (Inter after SF Pro, JetBrains Mono after
        # SF Mono), so text sets in metrics close to the Mac's.
        if [[ $E2E == true ]]; then packages+=(xvfb fonts-noto-cjk fonts-inter fonts-jetbrains-mono); fi
        if [[ $LIBREOFFICE == true ]]; then packages+=(libreoffice-writer libreoffice-impress); fi
        sudo apt-get update -q
        sudo apt-get install -yq --no-install-recommends "${packages[@]}"
        if [[ $LIBREOFFICE == true ]]; then soffice --version; fi
    # Electron's renderer sandbox needs unprivileged user namespaces, which Ubuntu 24.04's apparmor restricts; the app
    # keeps its sandbox (never --no-sandbox), so the runner lifts the restriction.
    - if: runner.os == 'Linux' && inputs.e2e == 'true'
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - shell: bash
      run: pnpm install --frozen-lockfile
