# The class-1 gates of docs/doperpowers/plans/2026-10-14-gate-offload.md (§3.1, §3.2, §3.6): the package scripts run
# verbatim on a runner. scripts/ci-gate.sh pushes the sha under test to a `ci/` ref, narrowing the set with a `Gates:`
# trailer, choosing the e2e lane with a `Runner:` trailer and class 1a's runner with a `Class1a:` trailer; a relaunch of
# part of a set names the whole set's other e2e groups in a `DefaultBeside:` trailer (Decision Log 66). An `Evidence: yes`
# trailer keeps a green run's e2e reports (Decision Log 48); a `Live: yes` trailer runs the LIVE_E2E groups, and only
# them, with their run flags on, a paid run each spec caps itself (Decision Log 75). On a Mac a MEASURED_E2E group first
# waits for ci-kit's measured-job guard to find the desktop settled, and is refused, to be relaunched, when it has not.
# A `Selection: affected` trailer (ci-gate.sh --affected) makes an iteration run: unit and unit:darwin test only what the
# change its `Affected:` trailers list can reach, or the whole suite where vitest's module graph cannot see (the plan
# says which, and why, in its summary). Such a run is never landing evidence (ci-kit's test-history spec, M4).
name: gate

on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      gates:
        description: 'A comma list over static, unit, unit:darwin, probes, packaged, e2e:<group> (e2e:default is the bare `pnpm e2e`, less the specs the run''s other e2e groups collect); empty runs the default set.'
        type: string
        default: ''
      runner:
        description: 'The e2e lane, linux or macos; empty takes GATE_E2E_RUNNER, then GATE_RUNNER, then linux.'
        type: string
        default: ''
      class1a:
        description: "Class 1a's runner (static, unit, probes), linux, macos or pool; empty takes GATE_RUNNER, then linux."
        type: string
        default: ''
      evidence:
        description: 'Upload e2e reports on success as well as failure for this run.'
        type: boolean
        default: false
      live:
        description: 'Run the paid live e2e groups with their run flags on; the gates must name LIVE_E2E groups only.'
        type: boolean
        default: false

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # tsc over the web project, and vitest's type-check pass in the unit job (dropped since, Decision Log 35), ran out of
  # Node's default heap on the 2-core runner once the artifact kinds landed (Decision Log 17 and 19); the runner has 7 GB.
  # A limit, not an allocation.
  NODE_OPTIONS: --max-old-space-size=5120
  # §3.1's class-1 e2e groups, the default set on a macOS lane. A name whose script is not in package.json is skipped,
  # so a child's group joins the default set at the commit that adds its script. browser-cua and browser-chrome are
  # macOS-only and run on fakes (the cua host, a synthetic Chrome profile, the MAWS_E2E_KEYCHAIN seam; Decision Log 35).
  CLASS1_E2E: >-
    default artifacts library side tools to-human deliverables panel supervisor browser browser-comment browser-import
    settings transcript terminal code agents widgets c7 scm c12 available document document-app presentations
    design-systems browser-cua browser-chrome desk-web design dashboard connectors connectors-direct connectors-oauth delivery
  # The groups §3.1's table found green on a Linux runner, the only ones a Linux lane takes (never by default). desk-web
  # (DC5): the desk's web app in a browser, against its DX3 double, which needs no Electron and no Mac.
  LINUX_E2E: library artifacts available tools agents desk-web
  # The Linux groups that drive no Electron, so the pool's containers, where Electron would lose its sandbox, can run
  # them. They never take the Mac, whatever the lane: they run on the pool when class 1a does, else on the hosted Linux
  # runner (Decision Log 68; on a Mac desk-web's suite drives the system Google Chrome, whose TCC prompts held the mini,
  # Decision Log 72). desk-web drives Playwright's own browsers, which Playwright starts without Chromium's sandbox on
  # every runner (chromiumSandbox).
  POOL_E2E: desk-web
  # The groups that render documents through LibreOffice (P3-B's DOCX-to-PDF case, P3-C's render-and-compare).
  LIBREOFFICE_E2E: document presentations
  # The paid live groups, each one spec that skips itself unless its run flag is `1` (MAWS_LIBRARY_LIVE for library-live,
  # MAWS_LIVE_DOCUMENT for document-live and document-provisional-live (P4-A2, the edit seen as it is written on the installed
  # engine), MAWS_LIVE for the rest; design-live and dashboard-live set theirs in their
  # package scripts) and caps its own spend. A `Live: yes` run sets the three flags on the e2e job and takes these groups
  # alone, since `default`'s bare `pnpm e2e` collects every one of their specs; any other run refuses them, since
  # design-live and dashboard-live would spend under their scripts' own flag (Decision Log 75). tool-time-heavy-live
  # (P4-A2, X34) is the tool-time guard's heavy-case fixture, a vitest file of the `live` project that sets MAWS_LIVE in
  # its script and spends nothing; LIVE_GUARD_E2E adds it to every live run, so every gate that runs the live specs holds
  # the heaviest known cases under the guard's bound.
  LIVE_E2E: library-live document-live document-provisional-live presentations-live design-systems-live design-live dashboard-live tool-time-heavy-live
  LIVE_GUARD_E2E: tool-time-heavy-live
  # The timing-measured groups, whose bounds were calibrated on the mini at @2x with no viewer and no foreign load, so a
  # result read under another posture is void (Decision Log 75's posture go). On a Mac each job's first step is ci-kit's
  # measured-job guard (SSFSKIM/ci-kit/mac/settle, ci-kit's docs/mac-lane.md): it releases the job once two reads 30 s
  # apart each show the 1-minute load under 5, the display at @2x, no Parsec viewer or screensharingd and no computer
  # use, and after 15 minutes refuses it with ci-kit's `ci-kit: … rerun` line, which scripts/ci-gate.sh counts as refused
  # and relaunches. Their job timeout adds those 15 minutes to the usual 30. tool-time-heavy-live (P4-A2, X34) holds
  # per-call bounds too: its 24-board design's create and publish ran 463 to 727 ms at a load of 18 to 25 on the MacBook,
  # and one of them passed the 1,000 ms bound at a load of about 75. document-scale-repeat (P4-R6) repeats row 5's first
  # batch after a read in one launch, recorded with no bound, so its strays are counted and named in the same posture.
  # dashboard-scale and design-scale admit any trial started below a load of 10, looser than their bounds hold:
  # dashboard-scale's replace row read 432 ms against its 500 at a load under 3, and beside foreign load at 5 to 6 its
  # replace read 510 and its cold open 1,299 against 1,000 (p4-r6-func, 2026-10-21; 634 relaunched quiet).
  MEASURED_E2E: artifacts-perf dashboard-scale design-scale document-scale document-scale-repeat presentations-scale tool-time-heavy-live

defaults:
  run:
    shell: bash

jobs:
  plan:
    # The smallest hosted runner (ubuntu-slim, 1 vCPU; the plan only computes outputs and takes seconds), or the self-hosted Mac
    # when the repository variable GATE_RUNNER is `macos` (§3.6); hosted under `pool`, since it is what makes the pool's box
    # (Decision Log 53). The jobs below take the runners the plan resolves: class 1a's from the `Class1a:` trailer or
    # GATE_RUNNER (linux, macos or pool), each e2e job its lane's runner or, for POOL_E2E, the pool's or hosted Linux's.
    # A push to master runs nothing here (the warm job of Decision Log 26 left with Decision Log 53); master's class 1a
    # is the landing gate's.
    runs-on: ${{ vars.GATE_RUNNER == 'macos' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-slim' }}
    timeout-minutes: 30
    outputs:
      static: ${{ steps.plan.outputs.static }}
      unit: ${{ steps.plan.outputs.unit }}
      unit_darwin: ${{ steps.plan.outputs.unit_darwin }}
      probes: ${{ steps.plan.outputs.probes }}
      e2e: ${{ steps.plan.outputs.e2e }}
      static_runner: ${{ steps.plan.outputs.static_runner }}
      unit_runner: ${{ steps.plan.outputs.unit_runner }}
      probes_runner: ${{ steps.plan.outputs.probes_runner }}
      packaged: ${{ steps.plan.outputs.packaged }}
      evidence: ${{ steps.plan.outputs.evidence }}
      live: ${{ steps.plan.outputs.live }}
      default_beside: ${{ steps.plan.outputs.default_beside }}
      selection: ${{ steps.plan.outputs.selection }}
      related: ${{ steps.plan.outputs.related }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            package.json
            .github
          sparse-checkout-cone-mode: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_GATES: ${{ inputs.gates }}
          INPUT_RUNNER: ${{ inputs.runner }}
          INPUT_CLASS1A: ${{ inputs.class1a }}
          INPUT_EVIDENCE: ${{ inputs.evidence }}
          INPUT_LIVE: ${{ inputs.live }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          GATE_RUNNER: ${{ vars.GATE_RUNNER }}
          GATE_E2E_RUNNER: ${{ vars.GATE_E2E_RUNNER }}
        run: node .github/scripts/gate-plan.mjs
      # ci-kit's pool (Decision Log 35): creates the box when a job runs there and none exists; it does not wait
      # for the boot, the jobs wait in GitHub's queue.
      - if: steps.plan.outputs.pool == 'true'
        uses: SSFSKIM/ci-kit/pool-ensure@v1
        with:
          hcloud-token: ${{ secrets.HCLOUD_TOKEN }}

  static:
    needs: plan
    if: needs.plan.outputs.static == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.static_runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The checks run at once (gate-bg.sh), each still a step of its own below, with its log and its gate-run summary:
      # tsc and eslint are single-threaded, and in series they held class 1a's critical path on a box whose other cores
      # sat idle. Each project of `pnpm typecheck` is a process of its own, read from the script.
      # The whole `pnpm build` (verify's step) is class 1a's proof that the renderer and the apps build; it ran in unit
      # until 2026-10-21, where it held the critical path (unit builds main and the preloads alone now).
      # The gate scripts' own tests (gate-plan, e2e-default-specs, ci-gate-alerts) have no lane of their own: vitest
      # collects no .github/ file, and e2e-default-specs pins default's own specs at the head, so a branch that adds a spec
      # or a group without moving the pin goes red here rather than unseen (P3-HD's 73 against the tree's 74, 2026-10-17).
      - run: |
          bg=.github/scripts/gate-bg.sh
          $bg start-parts typecheck 'error TS|problems?\b' typecheck
          $bg start lint 'error TS|problems?\b' pnpm lint
          $bg start build 'built in|error' pnpm build
          $bg start gate-scripts '^(ℹ|#) (tests|suites|pass|fail|cancelled|skipped|todo) ' node --test .github/scripts/*.test.mjs scripts/*.test.mjs
      - name: pnpm typecheck
        if: ${{ !cancelled() }}
        run: .github/scripts/gate-bg.sh wait typecheck
      - name: pnpm lint
        if: ${{ !cancelled() }}
        run: .github/scripts/gate-bg.sh wait lint
      - name: pnpm build
        if: ${{ !cancelled() }}
        run: .github/scripts/gate-bg.sh wait build
      - name: the gate scripts' tests
        if: ${{ !cancelled() }}
        run: .github/scripts/gate-bg.sh wait gate-scripts

  unit:
    needs: plan
    if: needs.plan.outputs.unit == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.unit_runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          apt: zsh # the shell suites start /bin/zsh, macOS's login shell
      # The two suites that read a build, the engine-host bundle guard (out/main) and the preload bundle suite
      # (out/preload), need electron-vite's main and preloads only; static runs the whole `pnpm build`.
      - run: .github/scripts/gate-run.sh 'built in|error' pnpm build:main-preload
      # vitest's workers at the job's cores: on Linux `nproc`, a container's cpuset (`getconf` reports the host's cores
      # there and over-forks; Decision Log 35); macOS has no stock `nproc`.
      # MAWS_TEST_JUNIT: the run's JUnit report beside vitest's own output (vitest.config.ts), uploaded below for ci-kit's
      # test history (ci-kit docs/doperpowers/specs/2026-10-21-test-history-design.md). It never decides the job: the
      # upload runs only after this step ran (so never another job's report from a persistent checkout), and its
      # failure is not the job's.
      # UNIT_RELATED: a selected run's paths (`Selection: affected`, the same spec's M4), when the plan found nothing there
      # vitest's module graph cannot see; the suites they reach then run in vitest's related mode, with the test script's
      # own NODE_OPTIONS (unit-related.mjs). Empty, the whole suite runs, as in every run that is not selected.
      - id: test
        env:
          MAWS_TEST_JUNIT: ci-results/unit.xml
          UNIT_RELATED: ${{ needs.plan.outputs.related }}
        run: |
          cores=$(if [[ $RUNNER_OS == Linux ]]; then nproc; else getconf _NPROCESSORS_ONLN; fi)
          rm -rf ci-results
          if [[ -n $UNIT_RELATED ]]; then
            NODE_OPTIONS="$NODE_OPTIONS --disable-warning=ExperimentalWarning" .github/scripts/gate-run.sh '^ *(Test Files|Tests|Errors|Duration) |^ *FAIL |^unit-related: ' node .github/scripts/unit-related.mjs "$cores"
          else
            .github/scripts/gate-run.sh '^ *(Test Files|Tests|Errors|Duration) |^ *FAIL ' pnpm test --maxWorkers="$cores"
          fi
      - if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit-${{ github.run_attempt }}
          path: ci-results/
          retention-days: 7
          if-no-files-found: ignore

  unit-darwin:
    name: unit:darwin
    needs: plan
    if: needs.plan.outputs.unit_darwin == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          apt: zsh # the shared setup skips apt on macOS
      # The unit job's JUnit report and its selection, as there; a selected run takes only the related suites among its
      # own files.
      - id: test
        env:
          MAWS_TEST_JUNIT: ci-results/unit-darwin.xml
          UNIT_RELATED: ${{ needs.plan.outputs.related }}
        run: |
          rm -rf ci-results
          if [[ -n $UNIT_RELATED ]]; then
            .github/scripts/gate-run.sh '^ *(Test Files|Tests|Errors|Duration) |^ *FAIL |^unit-related: ' node .github/scripts/unit-related.mjs "$(getconf _NPROCESSORS_ONLN)" $(scripts/darwin-unit-files.sh)
          else
            .github/scripts/gate-run.sh '^ *(Test Files|Tests|Errors|Duration) |^ *FAIL ' pnpm exec vitest run --maxWorkers="$(getconf _NPROCESSORS_ONLN)" $(scripts/darwin-unit-files.sh)
          fi
      - if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit-darwin-${{ github.run_attempt }}
          path: ci-results/
          retention-days: 7
          if-no-files-found: ignore

  probes:
    needs: plan
    if: needs.plan.outputs.probes == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.probes_runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: .github/scripts/gate-run.sh '^(ℹ|#) (tests|suites|pass|fail|cancelled|skipped|todo) ' pnpm test:probes

  # The unsigned packaged app (Decision Log 35): one `pnpm build:app`, then its fuses and the e2e scripts that run against
  # dist/ (the bare set, the detached supervisor, voice's packaged case). Only by `Gates: packaged`; always on the Mac.
  packaged:
    needs: plan
    if: needs.plan.outputs.packaged == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    env:
      MAWS_E2E_QUIET: '1'
      SHELL: /bin/zsh
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The voice helper compiles with swiftc. Without a developer directory, xcrun's shim would offer to install the
      # tools in a dialog on the runner's desktop, so it is asked first; nothing is ever installed here.
      - run: |
          if ! dir=$(xcode-select -p 2>/dev/null) || [[ ! -d $dir ]]; then
            echo '::error::packaged: no Xcode command-line tools on this runner (xcode-select -p finds none); build:app compiles the voice helper with swiftc. The owner installs them; the job installs nothing.'
            exit 1
          fi
          xcrun swiftc --version
      - id: build
        env:
          MAWS_SIGN_IDENTITY: '' # unsigned: build:app passes CSC_IDENTITY_AUTO_DISCOVERY=false itself
        run: .github/scripts/gate-run.sh 'built in|error|⨯|code signing' pnpm build:app
      # Each check runs whatever the one before it did, over the same build.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: .github/scripts/gate-run.sh 'RunAsNode|verify:fuses' pnpm verify:fuses
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/packaged
        run: .github/scripts/gate-run.sh '^ +[0-9]+ (passed|failed|flaky|skipped|interrupted|did not run)' pnpm e2e:packaged
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/supervisor-packaged
        run: .github/scripts/gate-run.sh '^ +[0-9]+ (passed|failed|flaky|skipped|interrupted|did not run)' pnpm e2e:supervisor:packaged
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/voice-packaged
        run: .github/scripts/gate-run.sh '^ +[0-9]+ (passed|failed|flaky|skipped|interrupted|did not run)' pnpm e2e:voice:packaged
      # Each run's HTML report keeps its screenshots and traces; test-results/ holds the last run's alone.
      - if: failure() || needs.plan.outputs.evidence == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-packaged
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    needs: plan
    if: needs.plan.outputs.e2e != '[]'
    name: e2e:${{ matrix.group }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: ${{ matrix.measured && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.e2e) }}
    env:
      MAWS_E2E_QUIET: '1'
      SHELL: /bin/zsh # the Mac's login shell, which the app's terminals and its login-shell capture start (setup installs it)
      # The live groups' run flags, `1` only when the plan says live, which it says only for a set of LIVE_E2E groups;
      # empty otherwise, which every spec reads as off (`!== '1'`), in a run the plan admits no live group to.
      MAWS_LIVE: ${{ needs.plan.outputs.live == 'true' && '1' || '' }}
      MAWS_LIBRARY_LIVE: ${{ needs.plan.outputs.live == 'true' && '1' || '' }}
      MAWS_LIVE_DOCUMENT: ${{ needs.plan.outputs.live == 'true' && '1' || '' }}
    steps:
      # A measured group waits here, before its checkout, until the Mac's desktop has settled (MEASURED_E2E above).
      - if: matrix.measured && runner.os == 'macOS'
        uses: SSFSKIM/ci-kit/mac/settle@v1
      - id: checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          e2e: 'true'
          libreoffice: ${{ matrix.libreoffice }}
      - if: matrix.build
        run: .github/scripts/gate-run.sh 'built in|error' pnpm build
      # Decision Log 60(2): beside other e2e groups, `default` runs only the specs none of them collects, derived at this
      # tree from their package scripts through `playwright test --list`; the groups of a `DefaultBeside:` trailer count
      # as beside it (Decision Log 66). Alone, or when the derivation cannot read a script, a named group has no script
      # or a listing fails (a warning says which), it is the bare `pnpm e2e`.
      - if: matrix.group == 'default'
        env:
          E2E_PLAN: ${{ needs.plan.outputs.e2e }}
          DEFAULT_BESIDE: ${{ needs.plan.outputs.default_beside }}
        run: |
          if ! node .github/scripts/e2e-default-specs.mjs >"$RUNNER_TEMP/e2e-specs"; then
            echo '::warning title=e2e:default runs the bare set::the derivation of its own specs failed'
            : >"$RUNNER_TEMP/e2e-specs"
          fi
      # DC5: the desk's browser suites drive Playwright's own Chromium on Linux, the only place the gate runs them
      # (POOL_E2E; a Mac would drive its installed Chrome). The phone's layout cases run again in Playwright's WebKit, on
      # Linux only (apps/desk-web/playwright.config.ts). On the pool, --with-deps installs their system libraries through
      # the runner's passwordless sudo, as on a hosted runner.
      # The install uses desk-web's own Playwright, the copy its suite runs, so the browsers match it whatever the root
      # package pins.
      - if: matrix.group == 'desk-web' && runner.os == 'Linux'
        run: pnpm --filter desk-web exec playwright install --with-deps chromium webkit
      - env:
          SCRIPT: ${{ matrix.script }}
        run: |
          display=()
          if [[ $RUNNER_OS == Linux ]]; then display=(xvfb-run -a --server-args='-screen 0 1920x1080x24'); fi
          # The one-job Mac builds each out/ variant once per run: scripts/e2e-build.sh restores it from this disk
          # (Decision Log 35); the key is the checked-out commit, whose sha the build stamp carries.
          if [[ $RUNNER_OS == macOS ]]; then export MAWS_E2E_BUILD_CACHE=$HOME/Library/Caches/maws-e2e-build MAWS_E2E_BUILD_KEY=$GITHUB_SHA; fi
          # default's own specs, when the step above derived them (macOS's bash 3.2 has no mapfile).
          specs=()
          if [[ -s $RUNNER_TEMP/e2e-specs ]]; then while IFS= read -r spec; do specs+=("$spec"); done <"$RUNNER_TEMP/e2e-specs"; fi
          # Playwright's count lines, and vitest's for the one group that runs a vitest file (tool-time-heavy-live, P4-A2).
          .github/scripts/gate-run.sh '^ +[0-9]+ (passed|failed|flaky|skipped|interrupted|did not run)|^e2e-build: |^ +(Test Files|Tests) +[0-9]' "${display[@]}" pnpm "$SCRIPT" "${specs[@]}"
      # Only after this job's own checkout: on the Mac the workspace persists between jobs and only the checkout's clean
      # clears the last job's reports, so a job that failed before it (a refused measured group) would upload another's.
      - if: (failure() || needs.plan.outputs.evidence == 'true') && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.slug }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
