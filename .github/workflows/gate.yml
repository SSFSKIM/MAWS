# The class-1 gates of docs/doperpowers/plans/2026-10-14-gate-offload.md (§3.1, §3.2, §3.6): the package scripts run
# verbatim on a runner. scripts/ci-gate.sh pushes the sha under test to a `ci/` ref, narrowing the set with a `Gates:`
# trailer and choosing the e2e lane with a `Runner:` trailer.
name: gate

on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      gates:
        description: 'A comma list over static, unit, probes, e2e:<group> (e2e:default is the bare `pnpm e2e`); empty runs the default set.'
        type: string
        default: ''
      runner:
        description: 'The e2e lane, linux or macos; empty takes GATE_E2E_RUNNER, then GATE_RUNNER, then linux.'
        type: string
        default: ''

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # tsc over the web project, and vitest's type-check pass in the unit job, ran out of Node's default heap on the 2-core
  # runner once the artifact kinds landed (Decision Log 17 and 19); the runner has 7 GB. A limit, not an allocation.
  NODE_OPTIONS: --max-old-space-size=5120
  # §3.1's class-1 e2e groups, the default set on a macOS lane. A name whose script is not in package.json is skipped,
  # so a child's group joins the default set at the commit that adds its script.
  CLASS1_E2E: >-
    default artifacts library side tools to-human deliverables panel supervisor browser browser-comment browser-import
    settings transcript terminal code agents widgets c7 scm c12 available document document-app presentations
    design-systems
  # The groups §3.1's table found green on a Linux runner, the only ones a Linux lane takes (never by default).
  LINUX_E2E: library artifacts available tools agents
  # The groups that render documents through LibreOffice (P3-B's DOCX-to-PDF case, P3-C's render-and-compare).
  LIBREOFFICE_E2E: document presentations

defaults:
  run:
    shell: bash

jobs:
  plan:
    # Class 1a's runner is chosen here alone (the jobs below repeat the anchor): Linux, or the self-hosted Mac when the
    # repository variable GATE_RUNNER is `macos` (§3.6). The e2e jobs take the lane the plan resolves.
    runs-on: &runner ${{ vars.GATE_RUNNER == 'macos' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    outputs:
      static: ${{ steps.plan.outputs.static }}
      unit: ${{ steps.plan.outputs.unit }}
      probes: ${{ steps.plan.outputs.probes }}
      e2e: ${{ steps.plan.outputs.e2e }}
      e2e_runner: ${{ steps.plan.outputs.e2e_runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            package.json
            .github
          sparse-checkout-cone-mode: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_GATES: ${{ inputs.gates }}
          INPUT_RUNNER: ${{ inputs.runner }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          GATE_RUNNER: ${{ vars.GATE_RUNNER }}
          GATE_E2E_RUNNER: ${{ vars.GATE_E2E_RUNNER }}
        run: node .github/scripts/gate-plan.mjs

  static:
    needs: plan
    if: needs.plan.outputs.static == 'true'
    runs-on: *runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: .github/scripts/gate-run.sh 'error TS|problems?\b' pnpm typecheck
      - if: ${{ !cancelled() }}
        run: .github/scripts/gate-run.sh 'error TS|problems?\b' pnpm lint

  unit:
    needs: plan
    if: needs.plan.outputs.unit == 'true'
    runs-on: *runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          apt: zsh # the shell suites start /bin/zsh, macOS's login shell
      # The bundle guard among the unit suites reads the built engine-host chunk.
      - run: .github/scripts/gate-run.sh 'built in|error' pnpm build
      - run: .github/scripts/gate-run.sh '^ *(Test Files|Tests|Type Errors|Errors|Duration) |^ *FAIL ' pnpm test --maxWorkers="$(getconf _NPROCESSORS_ONLN)"

  probes:
    needs: plan
    if: needs.plan.outputs.probes == 'true'
    runs-on: *runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: .github/scripts/gate-run.sh '^(ℹ|#) (tests|suites|pass|fail|cancelled|skipped|todo) ' pnpm test:probes

  e2e:
    needs: plan
    if: needs.plan.outputs.e2e != '[]'
    name: e2e:${{ matrix.group }}
    runs-on: ${{ fromJSON(needs.plan.outputs.e2e_runner) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.e2e) }}
    env:
      MAWS_E2E_QUIET: '1'
      SHELL: /bin/zsh # the Mac's login shell, which the app's terminals and its login-shell capture start (setup installs it)
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          e2e: 'true'
          libreoffice: ${{ matrix.libreoffice }}
      - if: matrix.build
        run: .github/scripts/gate-run.sh 'built in|error' pnpm build
      - env:
          SCRIPT: ${{ matrix.script }}
        run: |
          display=()
          if [[ $RUNNER_OS == Linux ]]; then display=(xvfb-run -a --server-args='-screen 0 1920x1080x24'); fi
          .github/scripts/gate-run.sh '^ +[0-9]+ (passed|failed|flaky|skipped|interrupted|did not run)' "${display[@]}" pnpm "$SCRIPT"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.slug }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
