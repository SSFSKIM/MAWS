# The class-1 gates of docs/doperpowers/plans/2026-10-14-gate-offload.md (§3.1, §3.2, §3.6): the package scripts run
# verbatim on a runner. scripts/ci-gate.sh pushes the sha under test to a `ci/` ref, narrowing the set with a `Gates:`
# trailer, choosing the e2e lane with a `Runner:` trailer and class 1a's runner with a `Class1a:` trailer; a relaunch of
# part of a set names the whole set's other e2e groups in a `DefaultBeside:` trailer (Decision Log 66). An `Evidence: yes`
# trailer keeps a green run's e2e reports (Decision Log 48); a `Live: yes` trailer runs the LIVE_E2E groups, and only
# them, with their run flags on, a paid run each spec caps itself (Decision Log 75). On a Mac a MEASURED_E2E group first
# waits for ci-kit's measured-job guard to find the desktop settled, and is refused, to be relaunched, when it has not.
# A `Selection: affected` trailer (ci-gate.sh --affected) makes an iteration run: unit and unit:darwin test only what the
# change its `Affected:` trailers list can reach, or the whole suite where vitest's module graph cannot see (the plan
# says which, and why, in its summary). Such a run is never landing evidence (ci-kit's test-history spec, M4). A `Lane:`
# trailer (ci-gate.sh --lane vm or vm-trial) sends the run's MAC_VM_E2E groups to ci-kit's macOS guest alone. A job the
# plan puts on the guest's labels never builds out/, which the guest's 4 GB cannot: the pool's e2e-build job builds the
# variants those jobs need at the tested sha, and e2e-vm runs them, restoring out/ from its artifacts (ci-kit's mac-lane
# concurrency spec, Decision Log "out/ is built on the pool"). On a macOS lane the eligible groups on HOSTED_MAC_E2E, or
# every eligible group of a run under `Lane: hosted` (ci-gate.sh --lane hosted; `no-hosted` keeps them all here), run on
# GitHub's hosted Macs. HOSTED_MAC_ROUTE (Hosted-Route: overrides it) defaults to mirror: e2e-hosted waits on the pool
# for SSFSKIM/maws-app. With direct, e2e runs the group here on macos-26, without the filter, scan or waiter. The lists
# and lane exclusions are unchanged (ci-kit's docs/doperpowers/specs/2026-10-26-maws-hosted-mac-design.md).
#
# ci-kit's VM contract (its mac-lane concurrency spec, The VM lane): on a Mac with ci-kit's guest, the exclusive
# instance's job-started hook reads the workflow a job runs under at its sha, and lets the job run beside a guest only
# when the file carries the line below at the number ci-kit knows; any other job keeps the guest off until it ends. The
# line promises that the guest can be kept off every job whose results it could change: every group with a timing bound
# is on MEASURED_E2E, and on a Mac every MEASURED_E2E job's first step is ci-kit's settle, which holds the guest off for
# it; and outside a measured job no raw time bound runs. A spec's upper bound on a time holds there only behind a
# measurement switch (MAWS_<name>_PERF or _SCALE, so a measured job alone asserts it), through the load-aware latency
# budget (test/support/latency-budget.ts): CI_KIT_VM_GUEST=1 is loaded; on the host, CI_KIT_VM_RESERVATION names
# vm-reserved, read at the verdict. A reservation present then, or its sibling vm-released epoch second >= floor(test
# start / 1000), means loaded. Other-than-not-found read errors and malformed releases count as loaded too; only a
# missing release means none seen. Read the reservation first, then the release, so a release between reads is seen.
# ci-kit reserves before clone, writes the release after delete, then removes the reservation. A configured lane alone
# does not loosen a bound. Otherwise it is a liveness bound gate-plan.test.mjs lists with its reason: a timer of
# the product's own with seconds of margin, or a spec no gate job runs. gate-plan.test.mjs pins that promise; the number
# moves only when what it pins does.
# ci-kit-vm-contract: 1
name: gate

on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      gates:
        description: 'A comma list over static, unit, unit:darwin, probes, packaged, e2e:<group> (e2e:default is the bare `pnpm e2e`, less the specs the run''s other e2e groups collect); empty runs the default set.'
        type: string
        default: ''
      runner:
        description: 'The e2e lane, linux or macos; empty takes GATE_E2E_RUNNER, then GATE_RUNNER, then linux.'
        type: string
        default: ''
      class1a:
        description: "Class 1a's runner (static, unit, probes), linux, macos or pool; empty takes GATE_RUNNER, then linux."
        type: string
        default: ''
      evidence:
        description: 'Upload e2e reports on success as well as failure for this run.'
        type: boolean
        default: false
      live:
        description: 'Run the paid live e2e groups with their run flags on; the gates must name LIVE_E2E groups only.'
        type: boolean
        default: false
      lane:
        description: "Where the e2e groups go on a Mac: vm (the MAC_VM_E2E groups to ci-kit's guest alone) or vm-trial (its trial slot); hosted (every eligible group to GitHub's hosted Macs) or no-hosted (none there); empty: either Mac desktop that is free, and HOSTED_MAC_E2E's groups hosted."
        type: string
        default: ''

      hosted_route:
        description: 'Hosted Mac route: mirror (default, through maws-app) or direct (macos-26 here); empty takes HOSTED_MAC_ROUTE.'
        type: string
        default: ''

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # tsc over the web project, and vitest's type-check pass in the unit job (dropped since, Decision Log 35), ran out of
  # Node's default heap on the 2-core runner once the artifact kinds landed (Decision Log 17 and 19); the runner has 7 GB.
  # A limit, not an allocation.
  NODE_OPTIONS: --max-old-space-size=5120
  # §3.1's class-1 e2e groups, the default set on a macOS lane. A name whose script is not in package.json is skipped,
  # so a child's group joins the default set at the commit that adds its script. browser-cua and browser-chrome are
  # macOS-only and run on fakes (the cua host, a synthetic Chrome profile, the MAWS_E2E_KEYCHAIN seam; Decision Log 35).
  CLASS1_E2E: >-
    default artifacts library side tools to-human deliverables panel supervisor browser browser-comment browser-import
    settings transcript terminal code agents widgets c7 scm c12 available document document-app presentations
    design-systems browser-cua browser-chrome desk-web design dashboard connectors connectors-direct connectors-oauth delivery
    discover machines
  # The groups §3.1's table found green on a Linux runner, the only ones a Linux lane takes (never by default). desk-web
  # (DC5): the desk's web app in a browser, against its DX3 double, which needs no Electron and no Mac.
  LINUX_E2E: library artifacts available tools agents desk-web
  # The Linux groups that drive no Electron, so the pool's containers, where Electron would lose its sandbox, can run
  # them. They never take the Mac, whatever the lane: they run on the pool when class 1a does, else on the hosted Linux
  # runner (Decision Log 68; on a Mac desk-web's suite drives the system Google Chrome, whose TCC prompts held the mini,
  # Decision Log 72). desk-web drives Playwright's own browsers, which Playwright starts without Chromium's sandbox on
  # every runner (chromiumSandbox).
  POOL_E2E: desk-web
  # The groups that render documents through LibreOffice (P3-B's DOCX-to-PDF case, P3-C's render-and-compare).
  LIBREOFFICE_E2E: document presentations
  # Poppler CLI users, derived from the specs and their imports by poppler-dependencies.test.mjs.
  # Keep live/scale users here too: if their placement changes, they still exercise the same PDF path.
  POPPLER_E2E: dashboard design design-live design-scale presentations
  # The paid live groups, each one spec that skips itself unless its run flag is `1` (MAWS_LIBRARY_LIVE for library-live,
  # MAWS_LIVE_DOCUMENT for document-live and document-provisional-live (P4-A2, the edit seen as it is written on the installed
  # engine), MAWS_LIVE for the rest (presentations-provisional-live among them: P4-A2 G2, a slide's publish seen as it is
  # written); design-live and dashboard-live set theirs in their package scripts) and caps its own spend. A `Live: yes`
  # run sets the three flags on the e2e job and takes these groups
  # alone, since `default`'s bare `pnpm e2e` collects every one of their specs; any other run refuses them, since
  # design-live and dashboard-live would spend under their scripts' own flag (Decision Log 75). tool-time-heavy-live
  # (P4-A2, X34) is the tool-time guard's heavy-case fixture, a vitest file of the `live` project that sets MAWS_LIVE in
  # its script and spends nothing; LIVE_GUARD_E2E adds it to every live run, so every gate that runs the live specs holds
  # the heaviest known cases under the guard's bound.
  LIVE_E2E: library-live document-live document-provisional-live presentations-live presentations-provisional-live design-systems-live design-live dashboard-live tool-time-heavy-live
  LIVE_GUARD_E2E: tool-time-heavy-live
  # The timing-measured groups, whose bounds were calibrated on the mini at @2x with no viewer and no foreign load, so a
  # result read under another posture is void (Decision Log 75's posture go). On a Mac each job's first step is ci-kit's
  # measured-job guard (SSFSKIM/ci-kit/mac/settle, ci-kit's docs/mac-lane.md): it releases the job once two reads 30 s
  # apart each show the 1-minute load under 5, the display at @2x, no Parsec viewer or screensharingd and no computer
  # use, and after 15 minutes refuses it with ci-kit's `ci-kit: … rerun` line, which scripts/ci-gate.sh counts as refused
  # and relaunches. A group whose script builds out/ builds it after that guard and waits at a second one before its
  # command, so the build's own load never lands in what it measures; the job timeout adds each guard's 15 minutes to
  # the usual 30. tool-time-heavy-live (P4-A2, X34) holds
  # per-call bounds too: its 24-board design's create and publish ran 463 to 727 ms at a load of 18 to 25 on the MacBook,
  # and one of them passed the 1,000 ms bound at a load of about 75. document-scale-repeat (P4-R6) repeats row 5's first
  # batch after a read in one launch, recorded with no bound, so its strays are counted and named in the same posture.
  # dashboard-scale and design-scale admit any trial started below a load of 10, looser than their bounds hold:
  # dashboard-scale's replace row read 432 ms against its 500 at a load under 3, and beside foreign load at 5 to 6 its
  # replace read 510 and its cold open 1,299 against 1,000 (p4-r6-func, 2026-10-21; 634 relaunched quiet).
  # presentations-drag (P4-B2 M0) is the deck drag's fast group: no-agent control trials alternating with agent trials
  # that republish through the host, the class-1 drag case under MAWS_PRESENTATIONS_PERF=1.
  # local-latency (P5 O1, OX7) is the local path's latency bench: a stub-engine session's delta to frame and command round
  # trip in detached mode, held to the baseline test/support/local-latency.ts records from three runs on the mini.
  # A group with a timing bound turns its timed cases on with a switch, MAWS_<name>_PERF or MAWS_<name>_SCALE set to 1 in
  # its package script, each such spec skipping without it or asserting its bounds only under it (presentations-drag's
  # one class-1 trial in e2e:presentations logs its p95), and is on this list: ci-kit's VM contract above rests on it.
  MEASURED_E2E: artifacts-perf dashboard-scale design-scale document-scale document-scale-repeat local-latency presentations-drag presentations-scale tool-time-heavy-live
  # The Mac jobs that may run beside another: e2e groups, and `unit:darwin`, that ask for ci-kit's shared instances
  # ([ci-kit-mac-shared], their only label), which run two jobs at a time on the mini's one desktop (ci-kit's mac-lane
  # concurrency spec, SSFSKIM/ci-kit docs/doperpowers/specs/2026-10-21-mac-lane-concurrency-design.md). Every other Mac
  # job asks for today's labels, which only the exclusive instance carries, and runs alone there; so a group nobody
  # listed, an old commit's run or a rerun never shares. A name joins only on that spec's trial evidence (its M4: paired
  # runs whose results match the solo control's); the plan keeps a MEASURED_E2E or foreground group alone whatever this
  # says.
  MAC_SHARED_E2E: ''
  # The Mac jobs that may run in ci-kit's macOS guest, a second desktop on the mini, booted fresh from a golden image for
  # one job and gone after it (the same spec, The VM lane): e2e groups, and `unit:darwin`, that ask for
  # [ci-kit-mac-solo], which the exclusive instance and the guest both carry, so each runs on whichever desktop is free.
  # A name joins only on that spec's trial evidence (its V4: green in the guest, matching the host's results). The plan
  # keeps a MEASURED_E2E group on the exclusive instance whatever this says, and runs a group on both lists shared; a
  # `Lane:` trailer moves these groups to the guest alone.
  # Wave 2 (V4, CI-opt): transcript, panel, c7, code, scm, library, document and settings were 3/3 green in guest runs
  # 40095523463, 40099706584 and 40107391110, matching host references 40095523499 and 40077708930. tools matched the
  # host's two stale failures in all three guest runs, its other 11 cases green; UX2 fixed those on master (f645666ee),
  # and tools now passes on the host. side had been held: the post-Reload pinned-card predicate failed in guest 40112861862
  # and host control 40118458114. design stays held.
  # Wave 2b (V4, CI-opt): dashboard was 3/3 green on maws-vm-golden-20261024a in guest runs 40114501885,
  # 40120234172 and 40121336786 (5.4, 5.2 and 4.6 min, against the host's 4.2 min).
  # Wave 2c (V4, CI-opt wave 2d): side was 3/3 green in guest runs 40123319856, 40124224867 and 40127753336 at master
  # 8757bfb90, after the re-pin fix (PR #139, merge 0acb77912), with no post-Reload pin failure (2.3, 2.9 and 3.1 min).
  # Wave 2d (V4, CI-opt wave 2e): presentations was 3/3 green at master 5495cea3b in guest runs 40129639783,
  # 40131644227 and 40132498574 (4.8, 5.3 and 5.4 min), after the history race fix (PR #141, merge 81011dd09).
  # Earlier, wave 2b was 2/3, one run hanging for 180 s at presentations.spec.ts:965; wave 2c was otherwise 3/3 green
  # at c38cfea0c except one presentations-history.spec.ts:137 red, the product race fixed by #141. The :965 hang was
  # 1 in 12 guest runs, never on the host; it stays known debt for the architect to record, not a timeout change here.
  # Wave 3 (V4, CI-opt): deliverables, supervisor, browser, browser-comment, browser-import, agents, c12, available,
  # design-systems, browser-chrome, composer and layout were 3/3 green on maws-vm-golden-20261024a in guest runs
  # 40140642786, 40146601191 and 40157558847. composer and layout are not class-1 groups (default's bare set collects
  # their specs), so they take the guest only when a run names them. In the guest, agents' stop-settle bound, browser's
  # 200 ms palette cover and browser-comment's 200 ms disarm are held to LOADED_CEILING (test/support/latency-budget.ts),
  # as on a loaded host.
  # Wave 4 (V4, CI-opt): delivery, connectors-oauth, artifacts and browser-cua were 3/3 green on maws-vm-golden-20261025
  # in guest runs 40200261879, 40212720841 and 40216462062. connectors and connectors-direct joined after the scratch
  # cleanup fix (detached engines with their cwd in the scratch are killed too, PR #149) passed 3/3 in guest runs
  # 40224021736, 40229482997 and 40231457492 on the same tree. None of these six
  # reaches the latency-budget helpers or enables a PERF/SCALE switch; artifacts' measured case stays skipped.
  # terminal stays held; design stays host-only.
  MAC_VM_E2E: >-
    document-app widgets to-human transcript panel c7 code scm library document settings tools dashboard side presentations
    deliverables supervisor browser browser-comment browser-import agents c12 available design-systems browser-chrome
    composer layout delivery connectors-oauth artifacts browser-cua connectors connectors-direct
  # The e2e groups that run on GitHub's hosted Macs on a macOS lane (ci-kit's hosted-Mac spec, Admission): a waiter on the
  # pool, the e2e-hosted job, runs each through SSFSKIM/maws-app, on macos-26 at 1920x1080@1x. A name joins on 3 of 3
  # green `Lane: hosted` runs on one tree whose count lines match a `Lane: no-hosted` baseline's, its specs reading neither
  # the display's scale nor its pixels, as MAC_VM_E2E's do on theirs. The plan refuses a name that is `default`, measured,
  # live, secret or POOL_E2E. A run on a reserved final ref (gate-plan.mjs's FINAL_LABELS: ci/h-final-*, ci/e1-final-* and
  # the rest) hosts none, since a final bundle is written only on the runner that ran its group. Emptying the list puts
  # every group back on the mini.
  # Wave 1 (CI-opt, the hosted-Mac spec's M3): document-app, browser-chrome, available and artifacts were 3/3 green under
  # `Lane: hosted` at master c9803aa1a in runs 40289382978, 40289421123 and 40289457942, each run's count lines those of
  # the `Lane: no-hosted` baseline 40300474330 on the same tree, every job on the host (document-app 20 passed,
  # browser-chrome 7, available 2, artifacts 4 passed and 1 skipped, its measured case). transcript stays off: red in
  # 40289382978 (transcript.spec.ts:1299, the sidebar hover card still shown 5 s after the pointer left), green in the
  # other two and in the baseline.
  # Wave 5 (CI-opt, M3): settings, connectors, connectors-direct and delivery were 3/3 green under `Lane: hosted` at master
  # e7ab5da39 (the font, the reserved-final rule and the hosted Dock in place) in runs 40300743480, 40300806384 and
  # 40300870157, each run's count lines those of the `Lane: no-hosted` baseline 40300686375 on the same tree, every job on
  # the host (settings 12 passed, its Nerd Font case run on both desktops; connectors 5; connectors-direct 15; delivery 3).
  # Waves 2 and 3 (CI-opt, M3), at master c9803aa1a, each run's count lines those of the shared `Lane: no-hosted` baseline
  # 40302689449 on the same tree, every job on the host: to-human (2 passed), widgets (29) and side (12) were 3/3 green under
  # `Lane: hosted` in runs 40290693239, 40290750401 and 40294506903; supervisor (10), c12 (4), browser-import (6) and
  # document (19) in runs 40293256908, 40293322930 and 40295843922. c7 stays off: red in 40290693239 and 40290750401 at
  # composer.spec.ts:772 (the user row's actions at opacity 0 after focus, against 1) and at :871 (a 1512x982 content
  # size clamped to 971 by the Dock, before #159).
  # Waves 4 and 6 (CI-opt, M3), at master c9803aa1a, each run's count lines those of the shared `Lane: no-hosted` baseline
  # 40306555606 on the same tree, every job on the host: code (37 passed), scm (8) and agents (23) were 3/3 green under
  # `Lane: hosted` in runs 40295904022, 40295964453 and 40296543781, no latency bound red; library (7), deliverables (12)
  # and presentations (38 passed, 10 skipped) in runs 40299148379, 40299211755 and 40299275020. Off: panel, red twice at
  # panel.spec.ts:1197 (the card at [420, 437], not its minimum [360, 240]); browser, red once at browser.spec.ts:363 (the
  # cover's placeholder image missing; its 200 ms bound passed); terminal, red 3/3 at terminal.spec.ts:508 (10044 lines
  # after the reload, not 10047); browser-cua, red at browser-cua.spec.ts:493 (connections 0, not 1) and :186 (innerWidth
  # 800, not 1280: the override not cleared after detach).
  # Wave 7 (CI-opt, M3): dashboard (12 passed), design (19), design-systems (8) and tools (14) were 3/3 green under
  # `Lane: hosted` at master e7ab5da39 (the font, the reserved-final rule and the hosted Dock in place) in runs 40305202999,
  # 40305270673 and 40305340291, each run's count lines those of the `Lane: no-hosted` baseline 40300686375 on the same
  # tree, every job on the host. tools' earlier reds at c9803aa1a were the Dock's clamp (maws-tools.spec.ts:239, 1512x982
  # to 971), gone with #159. dashboard and design are final-bundle groups: a reserved final run hosts none.
  # Wave 8 (CI-opt, M3; the set-asides again after #159): panel (27 passed) was 3/3 green under `Lane: hosted` at master
  # 70a2eff1a in runs 40312341344, 40312436985 and 40312502469, each run's count lines those of the `Lane: no-hosted`
  # baseline 40312170276 on the same tree, every job on the host; its wave-4 reds at panel.spec.ts:1197 did not recur.
  # Still off: c7, red 3/3 at composer.spec.ts:772 (the user row's actions at opacity 0 after focus, against 1; the :871
  # clamp gone); terminal, red 2/3 at terminal.spec.ts:508 (10044 lines after the reload, not 10047); browser, red 1/3 at
  # browser.spec.ts:363 (the cover's placeholder image missing).
  # browser-cua (the architect's ruling, after #166, gate-offload Decision Log 114 at a0b729dba): at head 5662a4cda (tree
  # 2fa9cdcea), with the undo fix in, it was green with 7 passed in three `Lane: hosted` runs, 40316175010, 40316176207
  # and 40316176658 (waiters on EC2 pool boxes), and in four runs on the mini, 40316186184, 40316186362, 40316177141 and
  # 40316186658; :186 and :493 passed in all seven. Its wave-6 :186 red was the undo's: Chromium answers
  # clearDeviceMetricsOverride before the view's restored size reaches the page, and the next attach now waits for it.
  # :493's earlier red has no cause in the logs; its debt row stays open.
  # terminal, c7, browser and transcript (the architect's ruling, after #172, gate-offload Decision Log 118 at 5529ac3bb):
  # #172 fixed what the hosted Macs exposed, three product races (composer focus after a send, the browser cover's
  # refused snapshot, the sidebar hover card's open/close race) and terminal's test comparing two sizes. At head
  # d894ad360 (tree 5a096f4d1) the three `Lane: hosted` runs 40331386561, 40331422403 and 40331460850 (waiters on EC2
  # pool boxes) and the mini's run 40331504505 each gave terminal 15 passed, c7 35, browser 11 and transcript 37. That
  # leaves on the mini only default, the secret groups and browser-comment.
  # machines (P5 O6 M6, docs/doperpowers/plans/2026-10-27-p5-o6-machine-dimension.md): the two-profile scenes, admitted
  # by the rule above on the tree that lists it, its three `Lane: hosted` runs and its `Lane: no-hosted` baseline
  # recorded in that document's Outcomes.
  HOSTED_MAC_E2E: >-
    document-app browser-chrome available artifacts settings connectors connectors-direct delivery to-human widgets side
    supervisor c12 browser-import document code scm agents library deliverables presentations dashboard design
    design-systems tools panel browser-cua terminal c7 browser transcript machines
  # Non-e2e jobs admitted to the direct hosted route. Lane: hosted/no-hosted never changes these.
  # packaged is unsigned but not admitted: run 40637823292 had four bare-suite failures
  # (layout-transfer:416 twice, :540; sessions:301). Admit only after fixes and 3/3 hosted passes.
  # A hosted packaged trial edits this list on its branch; the default stays self-hosted.
  HOSTED_MAC_JOBS: ''
  # The groups that need a credential or the login keychain's custody, so never go to a hosted Mac, whatever the lane
  # (maws-app holds no secret): connectors-oauth, and discover, whose custody conditions (a), (b) and (c) stand.
  MAC_SECRET_E2E: connectors-oauth discover
  # The e2e groups that need what only the mini's exclusive instance has, so ask for [ci-kit-mac-home] whatever the lane
  # and never go to a hosted Mac: discover, whose sign-in case starts a real engine session through ClaudeUsage's relay on
  # 127.0.0.1:8641, which the mini runs and the EC2 Mac does not (there it answered `relay_unreachable` in runs
  # 40429551303 and 40432481369).
  MAC_HOME_E2E: discover
  # The groups that check this tree against another build, its peer (the two-build check, e2e/cross-build.spec.ts):
  # scripts/ci-gate.sh names the peer in a `Peer:` trailer (the merge base with master, unless its --peer names another)
  # beside both trees' wires, and the plan adds these groups to a run with unit or an e2e group whenever the two are a
  # minor apart (gate-plan.mjs), unless an older run holds the check: then a hosted waiter follows its verdict.
  # A real peer job fetches that one
  # commit, checks it out under RUNNER_TEMP with an install of its own and builds its out/ (.github/scripts/gate-peer.sh),
  # and stops every supervisor of either build whatever happened. Exclusive on the mirror route; eligible on direct.
  PEER_E2E: cross-build

defaults:
  run:
    shell: bash

jobs:
  plan:
    permissions:
      contents: read
      actions: read
    # The smallest hosted runner (ubuntu-slim, 1 vCPU; the plan only computes outputs and takes seconds), or the self-hosted Mac
    # when the repository variable GATE_RUNNER is `macos` (§3.6); hosted under `pool`, since it is what makes the pool's box
    # (Decision Log 53). The jobs below take the runners the plan resolves: class 1a's from the `Class1a:` trailer or
    # GATE_RUNNER (linux, macos or pool), each e2e job its lane's runner or, for POOL_E2E, the pool's or hosted Linux's;
    # on the Mac, the exclusive instance's labels, the shared instances' for unit:darwin and the e2e groups on
    # MAC_SHARED_E2E, or [ci-kit-mac-solo] for those on MAC_VM_E2E (the guest's alone under a `Lane:`), which e2e-vm runs
    # after e2e-build, on the pool, made their out/.
    # A push to master runs nothing here (the warm job of Decision Log 26 left with Decision Log 53); master's class 1a
    # is the landing gate's.
    runs-on: ${{ vars.GATE_RUNNER == 'macos' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-slim' }}
    # On the Mac, the exclusive instance's wait bound on top (gate-plan.mjs's MAC_EXCLUSIVE_WAIT_MINUTES).
    timeout-minutes: ${{ vars.GATE_RUNNER == 'macos' && 40 || 30 }}
    outputs:
      static: ${{ steps.plan.outputs.static }}
      unit: ${{ steps.plan.outputs.unit }}
      unit_darwin: ${{ steps.plan.outputs.unit_darwin }}
      probes: ${{ steps.plan.outputs.probes }}
      e2e: ${{ steps.plan.outputs.e2e }}
      static_runner: ${{ steps.plan.outputs.static_runner }}
      unit_runner: ${{ steps.plan.outputs.unit_runner }}
      probes_runner: ${{ steps.plan.outputs.probes_runner }}
      packaged: ${{ steps.plan.outputs.packaged }}
      packaged_runner: ${{ steps.plan.outputs.packaged_runner }}
      evidence: ${{ steps.plan.outputs.evidence }}
      live: ${{ steps.plan.outputs.live }}
      default_beside: ${{ steps.plan.outputs.default_beside }}
      selection: ${{ steps.plan.outputs.selection }}
      related: ${{ steps.plan.outputs.related }}
      unit_shards: ${{ steps.plan.outputs.unit_shards }}
      unit_darwin_runner: ${{ steps.plan.outputs.unit_darwin_runner }}
      timeouts: ${{ steps.plan.outputs.timeouts }}
      e2e_host: ${{ steps.plan.outputs.e2e_host }}
      e2e_vm: ${{ steps.plan.outputs.e2e_vm }}
      e2e_build: ${{ steps.plan.outputs.e2e_build }}
      e2e_build_runner: ${{ steps.plan.outputs.e2e_build_runner }}
      e2e_hosted: ${{ steps.plan.outputs.e2e_hosted }}
      peer_wait: ${{ steps.plan.outputs.peer_wait }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            package.json
            .github
          sparse-checkout-cone-mode: false
      - name: Find an existing peer check
        env:
          EVENT: ${{ github.event_name }}
          GATE_RUNNER: ${{ vars.GATE_RUNNER }}
          GATE_E2E_RUNNER: ${{ vars.GATE_E2E_RUNNER }}
          HOSTED_MAC_ROUTE: ${{ vars.HOSTED_MAC_ROUTE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/gate-peer-held.mjs
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_GATES: ${{ inputs.gates }}
          INPUT_RUNNER: ${{ inputs.runner }}
          INPUT_CLASS1A: ${{ inputs.class1a }}
          INPUT_EVIDENCE: ${{ inputs.evidence }}
          INPUT_LIVE: ${{ inputs.live }}
          INPUT_LANE: ${{ inputs.lane }}
          INPUT_HOSTED_ROUTE: ${{ inputs.hosted_route }}
          HOSTED_MAC_ROUTE: ${{ vars.HOSTED_MAC_ROUTE }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          GATE_RUNNER: ${{ vars.GATE_RUNNER }}
          GATE_E2E_RUNNER: ${{ vars.GATE_E2E_RUNNER }}
        run: node .github/scripts/gate-plan.mjs

  # An omitted duplicate still owes the holder's verdict. Use a standard hosted runner: ubuntu-slim has a hard
  # 15-minute cap, while the mini's queue alone has reached 71 minutes. No Mac or pool instance is occupied here.
  e2e-peer-wait:
    needs: plan
    if: needs.plan.outputs.peer_wait != '[]'
    name: e2e:${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.peer_wait) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          PEER_RUN: ${{ matrix.run }}
          PEER_GROUP: ${{ matrix.group }}
          PEER_WAIT_MINUTES: ${{ matrix.wait }}
        run: .github/scripts/gate-run.sh '^held by run ' node .github/scripts/gate-peer-wait.mjs

  static:
    needs: plan
    if: needs.plan.outputs.static == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.static_runner) }}
    # 30, and on the Mac the exclusive instance's wait bound on top (gate-plan.mjs), as for unit and probes.
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeouts).static }}
    # Each check's step runs whatever the one before it did, but only in a job whose checkout ran: on a Mac, ci-kit's hook
    # refuses a job by failing its start, after which a `!cancelled()` step would still run, on the last job's workspace and
    # beside the jobs the hook kept it from (ci-kit's mac-lane concurrency spec; gate-plan.test.mjs walks every Mac job for
    # it).
    steps:
      - id: checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The checks run at once (gate-bg.sh), each still a step of its own below, with its log and its gate-run summary:
      # tsc and eslint are single-threaded, and in series they held class 1a's critical path on a box whose other cores
      # sat idle. Each project of `pnpm typecheck` is a process of its own, read from the script. At once only on a
      # machine of 24 GiB or more, the pool's 16-core box: together they peak at about 15 GB, so on the hosted runner
      # and the Mac the start step runs them one at a time.
      # The whole `pnpm build` (verify's step) is class 1a's proof that the renderer and the apps build; it ran in unit
      # until 2026-10-21, where it held the critical path (unit builds main and the preloads alone now).
      # The gate scripts' own tests (gate-plan, e2e-default-specs, ci-gate-alerts) have no lane of their own: vitest
      # collects no .github/ file, and e2e-default-specs pins default's own specs at the head, so a branch that adds a spec
      # or a group without moving the pin goes red here rather than unseen (P3-HD's 73 against the tree's 74, 2026-10-17).
      - run: |
          bg=.github/scripts/gate-bg.sh
          $bg start-parts typecheck 'error TS|problems?\b' typecheck
          $bg start lint 'error TS|problems?\b' pnpm lint
          $bg start build 'built in|error' pnpm build
          $bg start gate-scripts '^(ℹ|#) (tests|suites|pass|fail|cancelled|skipped|todo) ' node --test .github/scripts/*.test.mjs scripts/*.test.mjs
      - name: pnpm typecheck
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: .github/scripts/gate-bg.sh wait typecheck
      - name: pnpm lint
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: .github/scripts/gate-bg.sh wait lint
      - name: pnpm build
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: .github/scripts/gate-bg.sh wait build
      - name: the gate scripts' tests
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: .github/scripts/gate-bg.sh wait gate-scripts

  # On the pool the whole suite runs in shards, `unit <k>/<n>`, each its own box (gate-plan.mjs's UNIT_SHARDS); a
  # selected run that tests the related suites, and a run off the pool, is the one job `unit`.
  unit:
    name: ${{ matrix.shard && format('unit {0}', matrix.shard) || 'unit' }}
    needs: plan
    if: needs.plan.outputs.unit == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.unit_runner) }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeouts).unit }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.unit_shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          apt: zsh # the shell suites start /bin/zsh, macOS's login shell
      # The two suites that read a build, the engine-host bundle guard (out/main) and the preload bundle suite
      # (out/preload), need electron-vite's main and preloads only; static runs the whole `pnpm build`.
      - run: .github/scripts/gate-run.sh 'built in|error' pnpm build:main-preload
      # vitest's workers at the job's cores: on Linux `nproc`, a container's cpuset (`getconf` reports the host's cores
      # there and over-forks; Decision Log 35); macOS has no stock `nproc`.
      # MAWS_TEST_JUNIT: the run's JUnit report beside vitest's own output (vitest.config.ts), uploaded below for ci-kit's
      # test history (ci-kit docs/doperpowers/specs/2026-10-21-test-history-design.md), a shard's under a name of its own
      # that the collector reads with the other shards' as one `unit` report. It never decides the job: the upload runs
      # only after this step ran (so never another job's report from a persistent checkout), and its failure is not the
      # job's.
      # SHARD: this job's vitest --shard, <k>/<n>, or empty for the whole suite in one job.
      # UNIT_RELATED: a selected run's paths (`Selection: affected`, the same spec's M4), when the plan found nothing there
      # vitest's module graph cannot see; the suites they reach then run in vitest's related mode, with the test script's
      # own NODE_OPTIONS (unit-related.mjs). Empty, the whole suite runs, as in every run that is not selected.
      # --fsModuleCache (and unit-related.mjs's own option): vitest writes each module it transforms under
      # node_modules/.vitest-cache, and a project whose plugins and resolve config match another's reads it there rather
      # than transforming it again. Each `-timing` project has a Vite server of its own, so without it the whole app was
      # transformed again at the end of the run while the two App.test.tsx waited (42-52 s of their tests, 7-9 s with
      # it); the whole suite in one job ran about 45 s shorter (ci-kit's test-history spec, M5, arm C0), and each shard
      # takes it as well. The cache starts empty in every job: nothing restores it, and the checkout's clean removes
      # node_modules, so a job reads only what it wrote.
      - id: test
        env:
          MAWS_TEST_JUNIT: ci-results/unit.xml
          UNIT_RELATED: ${{ needs.plan.outputs.related }}
          SHARD: ${{ matrix.shard }}
        run: |
          cores=$(if [[ $RUNNER_OS == Linux ]]; then nproc; else getconf _NPROCESSORS_ONLN; fi)
          rm -rf ci-results
          if [[ -n $UNIT_RELATED ]]; then
            NODE_OPTIONS="$NODE_OPTIONS --disable-warning=ExperimentalWarning" .github/scripts/gate-run.sh '^ *(Test Files|Tests|Errors|Duration) |^ *FAIL |^unit-related: ' node .github/scripts/unit-related.mjs "$cores"
          else
            .github/scripts/gate-run.sh '^ *(Test Files|Tests|Errors|Duration) |^ *FAIL ' pnpm test --maxWorkers="$cores" --fsModuleCache ${SHARD:+--shard="$SHARD"}
          fi
      - if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit${{ matrix.slug }}-${{ github.run_attempt }}
          path: ci-results/
          retention-days: 7
          if-no-files-found: ignore

  unit-darwin:
    name: unit:darwin
    needs: plan
    if: needs.plan.outputs.unit_darwin == 'true'
    # The exclusive instance, a shared one when MAC_SHARED_E2E names unit:darwin, solo or the guest when MAC_VM_E2E does;
    # the timeout as the plan says.
    runs-on: ${{ fromJSON(needs.plan.outputs.unit_darwin_runner) }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeouts).unit_darwin }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          apt: zsh # the shared setup skips apt on macOS
      # The unit job's JUnit report, its selection and its module cache, as there; a selected run takes only the related
      # suites among its own files.
      - id: test
        env:
          MAWS_TEST_JUNIT: ci-results/unit-darwin.xml
          UNIT_RELATED: ${{ needs.plan.outputs.related }}
        run: |
          rm -rf ci-results
          if [[ -n $UNIT_RELATED ]]; then
            .github/scripts/gate-run.sh '^ *(Test Files|Tests|Errors|Duration) |^ *FAIL |^unit-related: ' node .github/scripts/unit-related.mjs "$(getconf _NPROCESSORS_ONLN)" $(scripts/darwin-unit-files.sh)
          else
            .github/scripts/gate-run.sh '^ *(Test Files|Tests|Errors|Duration) |^ *FAIL ' pnpm exec vitest run --maxWorkers="$(getconf _NPROCESSORS_ONLN)" --fsModuleCache $(scripts/darwin-unit-files.sh)
          fi
      - if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit-darwin-${{ github.run_attempt }}
          path: ci-results/
          retention-days: 7
          if-no-files-found: ignore

  probes:
    needs: plan
    if: needs.plan.outputs.probes == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.probes_runner) }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeouts).probes }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: .github/scripts/gate-run.sh '^(ℹ|#) (tests|suites|pass|fail|cancelled|skipped|todo) ' pnpm test:probes

  # The unsigned packaged app (Decision Log 35): one `pnpm build:app`, then its fuses and the e2e scripts that run against
  # dist/ (the bare set, the detached supervisor, voice's packaged case). Only by `Gates: packaged`; unsigned, so
  # HOSTED_MAC_JOBS may admit it to direct macos-26. Unlisted (today), the plan keeps the self-hosted fallback.
  packaged:
    needs: plan
    if: needs.plan.outputs.packaged == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.packaged_runner || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeouts).packaged || 40 }}
    env:
      MAWS_E2E_QUIET: '1'
      SHELL: /bin/zsh
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        # e2e:packaged collects the bare set, including the PDF/export specs. Keep the full declaration
        # on a hosted Mac too, rather than the named e2e groups' per-group dependency skips.
        with:
          libreoffice: 'true'
          poppler: 'true'
      # The voice helper compiles with swiftc. Without a developer directory, xcrun's shim would offer to install the
      # tools in a dialog on the runner's desktop, so it is asked first; nothing is ever installed here.
      - run: |
          if ! dir=$(xcode-select -p 2>/dev/null) || [[ ! -d $dir ]]; then
            echo '::error::packaged: no Xcode command-line tools on this runner (xcode-select -p finds none); build:app compiles the voice helper with swiftc. The owner installs them; the job installs nothing.'
            exit 1
          fi
          xcrun swiftc --version
      - id: build
        env:
          MAWS_SIGN_IDENTITY: '' # unsigned: build:app passes CSC_IDENTITY_AUTO_DISCOVERY=false itself
        run: .github/scripts/gate-run.sh 'built in|error|⨯|code signing' pnpm build:app
      # Each check runs whatever the one before it did, over the same build.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: .github/scripts/gate-run.sh 'RunAsNode|verify:fuses' pnpm verify:fuses
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/packaged
        run: .github/scripts/gate-run.sh '^ +[0-9]+ (passed|failed|flaky|skipped|interrupted|did not run)' pnpm e2e:packaged
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/supervisor-packaged
        run: .github/scripts/gate-run.sh '^ +[0-9]+ (passed|failed|flaky|skipped|interrupted|did not run)' pnpm e2e:supervisor:packaged
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/voice-packaged
        run: .github/scripts/gate-run.sh '^ +[0-9]+ (passed|failed|flaky|skipped|interrupted|did not run)' pnpm e2e:voice:packaged
      # Each run's HTML report keeps its screenshots and traces; test-results/ holds the last run's alone.
      - if: failure() || needs.plan.outputs.evidence == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-packaged
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The out/ variants the guest-eligible e2e groups restore (the plan's e2e_build; ci-kit's mac-lane concurrency spec,
  # Decision Log "out/ is built on the pool"), each built once at this sha on a pool box through scripts/e2e-build.sh's
  # own build-and-store, into a cache of this job's own, and uploaded as the artifact e2e-build-<sha>-<variant>, which
  # holds that cache's <sha>/<variant>/{out,digest}. Only when the plan puts an e2e job on the guest's labels; else the
  # job does not run and the pool's minutes are as before. Kept a week, as the e2e reports are, so a rerun of an e2e-vm
  # job finds its build; overwritten by a rerun of this job.
  e2e-build:
    needs: plan
    if: needs.plan.outputs.e2e_build != '[]'
    runs-on: ${{ fromJSON(needs.plan.outputs.e2e_build_runner) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.e2e_build) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - env:
          VARIANT: ${{ matrix.variant }}
        run: |
          rm -rf "$RUNNER_TEMP/maws-e2e-build"
          export MAWS_E2E_BUILD_CACHE=$RUNNER_TEMP/maws-e2e-build MAWS_E2E_BUILD_KEY=$GITHUB_SHA
          .github/scripts/gate-run.sh 'built in|error|^e2e-build: ' scripts/e2e-build.sh "$VARIANT"
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-build-${{ github.sha }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/maws-e2e-build/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The hosted e2e groups (the plan's e2e_hosted), each a waiter on the pool's cpus-2 box under the group's own job name
  # (ci-kit's hosted-Mac spec, The flow of one hosted group): .github/scripts/hosted-mac.sh pushes this commit's filtered
  # tree, after a secret scan of what it adds, to SSFSKIM/maws-app over git with the deploy key, waits for the group's run
  # on a hosted Mac there to write its result, and exits with it. The cleanup cancels a request left without its result
  # (a cancelled run, a red step) and is best-effort. The deploy key is git access to maws-app and nothing else; no other
  # job reads it.
  e2e-hosted:
    needs: plan
    if: needs.plan.outputs.e2e_hosted != '[]'
    name: e2e:${{ matrix.group }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.e2e_hosted) }}
    steps:
      - uses: actions/checkout@v7
      - name: the hosted run
        env:
          ENTRY: ${{ toJSON(matrix) }}
          EVIDENCE: ${{ needs.plan.outputs.evidence }}
          MAWS_APP_DEPLOY_KEY: ${{ secrets.MAWS_APP_DEPLOY_KEY }}
          # MAWS's compare API, read for the main refresh: is the requested commit on master.
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/hosted-mac.sh
      - name: cleanup
        if: always()
        run: .github/scripts/hosted-mac.sh --cleanup

  # The e2e groups outside the guest and mirror matrices (e2e_host), including direct hosted Macs. A direct job builds
  # out/ on its own Mac or restores it from the Actions cache (its entry's `cached`): no pool prerequisite or artifact
  # transfer. e2e-vm shares these steps for guest jobs.
  e2e:
    needs: plan
    if: needs.plan.outputs.e2e_host != '[]'
    name: e2e:${{ matrix.group }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    # 30, a measured group's 45, and on the Mac the wait bound of its instance's start on top (gate-plan.mjs).
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.e2e_host) }}
    env: &e2e-env
      MAWS_E2E_QUIET: '1'
      SHELL: /bin/zsh # the Mac's login shell, which the app's terminals and its login-shell capture start (setup installs it)
      # The live groups' run flags, `1` only when the plan says live, which it says only for a set of LIVE_E2E groups;
      # empty otherwise, which every spec reads as off (`!== '1'`), in a run the plan admits no live group to.
      MAWS_LIVE: ${{ needs.plan.outputs.live == 'true' && '1' || '' }}
      MAWS_LIBRARY_LIVE: ${{ needs.plan.outputs.live == 'true' && '1' || '' }}
      MAWS_LIVE_DOCUMENT: ${{ needs.plan.outputs.live == 'true' && '1' || '' }}
    # One list for both e2e jobs (a YAML anchor, which e2e-vm aliases): what differs is the entry's `variant`, which only
    # a guest-eligible entry carries.
    steps: &e2e-steps
      # A measured group waits here, before its checkout, until the Mac's desktop has settled (MEASURED_E2E above).
      - if: matrix.measured && runner.os == 'macOS'
        uses: SSFSKIM/ci-kit/mac/settle@v1
      - id: checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          e2e: 'true'
          libreoffice: ${{ matrix.libreoffice }}
          poppler: ${{ matrix.poppler }}
      # A guest-eligible group's out/, e2e-build's artifact for its variant at this sha, into this job's temp directory,
      # the build cache its run below restores from.
      - if: matrix.variant
        uses: actions/download-artifact@v8
        with:
          name: e2e-build-${{ github.sha }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/maws-e2e-build
      # A direct hosted Mac's out/ (the entry's `cached` variant), restored from the Actions cache, where the run's first job
      # to build that variant saved it under the commit and the variant; else built here and saved. A set larger than the
      # account's 5 hosted Macs runs in rounds, and only the first round builds. The command's own build restores it from
      # this directory, checking its digest, and builds after all when it does not match. The path is the same on every
      # hosted Mac, as a cache entry's version requires; a save another job of the run made first never fails this one.
      - id: build-cache
        if: matrix.cached
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/maws-e2e-build/${{ github.sha }}/${{ matrix.cached }}
          key: e2e-build-${{ runner.os }}-${{ github.sha }}-${{ matrix.cached }}
      - if: matrix.cached && steps.build-cache.outputs.cache-hit != 'true'
        env:
          CACHED: ${{ matrix.cached }}
        run: |
          export MAWS_E2E_BUILD_CACHE=$RUNNER_TEMP/maws-e2e-build MAWS_E2E_BUILD_KEY=$GITHUB_SHA
          .github/scripts/gate-run.sh 'built in|error|^e2e-build: ' scripts/e2e-build.sh "$CACHED"
      - if: matrix.cached && steps.build-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/maws-e2e-build/${{ github.sha }}/${{ matrix.cached }}
          key: e2e-build-${{ runner.os }}-${{ github.sha }}-${{ matrix.cached }}
      - if: matrix.build
        run: .github/scripts/gate-run.sh 'built in|error' pnpm build
      # A PEER_E2E group's peer (the plan's `peer`, the commit the `Peer:` trailer names): that commit alone fetched, checked
      # out under RUNNER_TEMP, installed against the runner's pnpm store and built as its own e2e groups build it; its root
      # reaches the spec as MAWS_E2E_PEER_ROOT below.
      - id: peer
        if: matrix.peer
        env:
          PEER: ${{ matrix.peer }}
        run: .github/scripts/gate-run.sh 'built in|error|^gate-peer' .github/scripts/gate-peer.sh prepare "$PEER" "$RUNNER_TEMP/maws-peer"
      # P4-AGG M1 (docs/doperpowers/specs/2026-10-24-plugin-aggregator-design.md): the Discover group runs the real engine
      # 2.1.309, provisioned here, before its offline test phase: the official build, verified against the checksum
      # committed in scripts/engine-checksums.txt and cached by version under the runner's user directory; the script
      # exports MAWS_E2E_ENGINE_BIN to the steps after. e2e/support/real-engine.ts checks the version again at test time,
      # so a run that skipped this step fails there rather than running another engine.
      - if: matrix.group == 'discover'
        run: scripts/provision-engine.sh 2.1.309
      # Decision Log 60(2): beside other e2e groups, `default` runs only the specs none of them collects, derived at this
      # tree from their package scripts through `playwright test --list`; the groups of a `DefaultBeside:` trailer count
      # as beside it (Decision Log 66). Alone, or when the derivation cannot read a script, a named group has no script
      # or a listing fails (a warning says which), it is the bare `pnpm e2e`.
      - if: matrix.group == 'default'
        env:
          E2E_PLAN: ${{ needs.plan.outputs.e2e }}
          DEFAULT_BESIDE: ${{ needs.plan.outputs.default_beside }}
        run: |
          if ! node .github/scripts/e2e-default-specs.mjs >"$RUNNER_TEMP/e2e-specs"; then
            echo '::warning title=e2e:default runs the bare set::the derivation of its own specs failed'
            : >"$RUNNER_TEMP/e2e-specs"
          fi
      # DC5: the desk's browser suites drive Playwright's own Chromium on Linux, the only place the gate runs them
      # (POOL_E2E; a Mac would drive its installed Chrome). The phone's layout cases run again in Playwright's WebKit, on
      # Linux only (apps/desk-web/playwright.config.ts). On the pool, --with-deps installs their system libraries through
      # the runner's passwordless sudo, as on a hosted runner.
      # The install uses desk-web's own Playwright, the copy its suite runs, so the browsers match it whatever the root
      # package pins.
      - if: matrix.group == 'desk-web' && runner.os == 'Linux'
        run: pnpm --filter desk-web exec playwright install --with-deps chromium webkit
      # A measured group's out/, built (or restored from this Mac's disk, where the command below finds it again) before a
      # second guard: the first released the job before the setup and the build, whose load then landed in the measured
      # window (O2's idle-bound runs, 2026-10-28: released at a 1-minute load of 2.33 and 3.32, ended at 7.11 and 9.87).
      # The first guard's claim keeps the guest off until the job ends, so the second claims nothing.
      - if: matrix.prebuild && runner.os == 'macOS'
        env:
          PREBUILD: ${{ matrix.prebuild }}
        run: |
          export MAWS_E2E_BUILD_CACHE=$HOME/Library/Caches/maws-e2e-build/$RUNNER_NAME MAWS_E2E_BUILD_KEY=$GITHUB_SHA
          .github/scripts/gate-run.sh 'built in|error|^e2e-build: ' scripts/e2e-build.sh "$PREBUILD"
      - if: matrix.prebuild && runner.os == 'macOS'
        uses: SSFSKIM/ci-kit/mac/settle@v1
        with:
          vm: any
      - env:
          SCRIPT: ${{ matrix.script }}
          MAWS_E2E_RETRY: ${{ github.job == 'e2e' && matrix.retry && runner.environment == 'github-hosted' && runner.os == 'macOS' && '1' || '' }}
          MAWS_E2E_FLAKY_FILE: ${{ runner.temp }}/maws-e2e-flaky.txt
          VARIANT: ${{ matrix.variant }}
          CACHED: ${{ matrix.cached }}
          MAWS_E2E_PEER_ROOT: ${{ matrix.peer && format('{0}/maws-peer', runner.temp) || '' }}
        run: |
          display=()
          if [[ $RUNNER_OS == Linux ]]; then display=(xvfb-run -a --server-args='-screen 0 1920x1080x24'); fi
          # A guest-eligible group restores e2e-build's out/, downloaded above, and never builds: scripts/e2e-build.sh fails
          # naming the key and the variant when the entry is missing or does not match its digest.
          # A direct hosted Mac restores the out/ the cache steps above restored or built.
          # Else the Mac builds each out/ variant once per run and runner: scripts/e2e-build.sh restores it from this disk
          # (Decision Log 35); the key is the checked-out commit, whose sha the build stamp carries. One directory per
          # runner instance (ci-kit's mac-lane concurrency spec, M2): two shared jobs on one variant would otherwise race
          # its restore, its store and the prune.
          if [[ -n $VARIANT ]]; then
            export MAWS_E2E_BUILD_CACHE=$RUNNER_TEMP/maws-e2e-build MAWS_E2E_BUILD_KEY=$GITHUB_SHA MAWS_E2E_BUILD_REQUIRE=1
          elif [[ -n $CACHED ]]; then export MAWS_E2E_BUILD_CACHE=$RUNNER_TEMP/maws-e2e-build MAWS_E2E_BUILD_KEY=$GITHUB_SHA
          elif [[ $RUNNER_OS == macOS ]]; then export MAWS_E2E_BUILD_CACHE=$HOME/Library/Caches/maws-e2e-build/$RUNNER_NAME MAWS_E2E_BUILD_KEY=$GITHUB_SHA; fi
          # default's own specs, when the step above derived them (macOS's bash 3.2 has no mapfile).
          specs=()
          if [[ -s $RUNNER_TEMP/e2e-specs ]]; then while IFS= read -r spec; do specs+=("$spec"); done <"$RUNNER_TEMP/e2e-specs"; fi
          # Playwright's count lines, and vitest's for the one group that runs a vitest file (tool-time-heavy-live, P4-A2).
          .github/scripts/gate-run.sh '^flaky: |^ +[0-9]+ (passed|failed|flaky|skipped|interrupted|did not run)|^e2e-build: |^ +(Test Files|Tests) +[0-9]' "${display[@]}" pnpm "$SCRIPT" "${specs[@]}"
      # One aggregate notice in its own step: GitHub caps annotations per step, so even a group with many flakes keeps
      # every location, without competing with the test command's other warnings. The summary above stays one per line.
      - name: Publish flaky tests
        if: always() && github.job == 'e2e' && matrix.retry && runner.environment == 'github-hosted' && runner.os == 'macOS' && steps.checkout.outcome == 'success'
        run: node scripts/ci-flaky-reporter.mjs "$RUNNER_TEMP/maws-e2e-flaky.txt"
      # The peer's supervisors and this tree's outlive their apps by design (detached, each in a process group of its own),
      # so whatever the run did, every one of either build is stopped here, with the peer's apps and checkout: nothing the
      # job started is left to the next job on this Mac.
      # Any job of a peer group that checked out, so a prepare cancelled midway is undone too.
      - if: always() && matrix.peer && steps.checkout.outcome == 'success'
        run: .github/scripts/gate-peer.sh stop "$RUNNER_TEMP/maws-peer"
      # Only after this job's own checkout: on the Mac the workspace persists between jobs and only the checkout's clean
      # clears the last job's reports, so a job that failed before it (a refused measured group) would upload another's.
      # desk-web's suites (desk-web, desk-web-hub) run under apps/desk-web and write their output there.
      - if: (failure() || needs.plan.outputs.evidence == 'true') && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.slug }}
          path: |
            playwright-report/
            test-results/
            apps/desk-web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The guest-eligible e2e groups (the plan's e2e_vm: on ci-kit-mac-solo, -vm or -vm-trial), on whichever desktop takes
  # them, once e2e-build has made their out/: the e2e job's env and steps, which restore it under MAWS_E2E_BUILD_REQUIRE=1.
  e2e-vm:
    needs: [plan, e2e-build]
    if: needs.plan.outputs.e2e_vm != '[]'
    name: e2e:${{ matrix.group }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    # As the e2e job's: 30, and on the exclusive instance's labels or the solo label its wait bound on top (gate-plan.mjs).
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.e2e_vm) }}
    env: *e2e-env
    steps: *e2e-steps
