# Unsigned local build (charter §12 C1 *Packaging skeleton*): `pnpm build:app` → dist/mac-arm64/MAWS.app.
# Signing, notarization, DMG and updates arrive with the child that ships a release.
# C12 start (C12 execution document, M4 task 6; charter D7): C12 is that child, and for P0 ships this much.
# The build is owner-only for P0: rebuilt from source on the owner's Mac, development-signed when MAWS_SIGN_IDENTITY
# names a keychain identity (`MAWS_SIGN_IDENTITY="Apple Development: …" pnpm build:app`, which sets mac.identity below
# from the command line), unsigned otherwise (`identity: null`, the default `pnpm verify` builds).
# `appId` and `productName` are placeholders the owner names.
# Signing with a Developer ID and the hardened runtime, notarization, DMG and ZIP targets, and the updater are the
# deferred P1 milestones of the C12 document (P1-R1 to P1-R4), each started only when its preconditions exist.
# C12 end
appId: dev.maws.app # placeholder; the owner renames it
productName: MAWS # placeholder; the owner names it (C12)
directories:
  output: dist
files:
  - out/**
  - package.json
# node-pty's pty.node is loaded and its spawn-helper executed from real files beside the asar.
asarUnpack:
  - node_modules/node-pty/**
# node-pty ships an N-API prebuild that runs under Electron as is (§12 C1 *node-pty native module*).
npmRebuild: false
mac:
  target:
    - target: dir
      arch: [arm64]
  identity: null
  hardenedRuntime: false
  category: public.app-category.developer-tools
  # E9 start (E9 execution document, M1; Design §4 and §10): the dictation helper and its permissions.
  # Both usage descriptions are the reasons macOS shows in the Microphone and Speech Recognition dialogs.
  extendInfo:
    NSMicrophoneUsageDescription: MAWS uses the microphone to dictate into the composer while you hold the dictation key.
    NSSpeechRecognitionUsageDescription: MAWS transcribes your dictation on this Mac with Apple's speech recognition.
  # Applied only when the build is signed (MAWS_SIGN_IDENTITY); osx-sign signs the helper with the app's identity.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
# `pnpm build:helper` (chained first in `pnpm build:app`) writes build/voice-helper/maws-voice-helper.
extraResources:
  - from: build/voice-helper
    to: voice-helper
    filter:
      - maws-voice-helper
# E9 end
