<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAWS · Attention &amp; command surfaces</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="tokens.css">
<style>
/* Adopted from the MAWS mockup kit: quiet, dense, dark tonal chrome.
   Pending decisions own the first read. Accent means action or selection.
   Each frame is a real-size crop, not a scaled desktop. Companion overlays
   are held open for inspection; narrow layouts stack these companions. */
* { box-sizing: border-box; }
body { padding: 40px 24px 72px; }
main { width: 760px; max-width: 100%; margin: 0 auto; }
button,input,textarea,summary { font: inherit; }
button,a,input,textarea,summary { -webkit-tap-highlight-color: transparent; }
button { color: var(--fg); background: transparent; border: 0; cursor: pointer; }
a { color: var(--fg); text-decoration: none; }
a:hover { text-decoration: underline; }
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
button:hover { background: var(--bg-hover); }
input[type=radio],input[type=checkbox] { accent-color: var(--accent); }
h1,h2,h3,p { margin: 0; }
h1 { font-size: 21px; font-weight: 600; letter-spacing: -.45px; }
h2 { font-size: 13px; font-weight: 550; }
h3 { font-size: 13px; font-weight: 600; }
.page-head { padding-bottom: 28px; border-bottom: 1px solid var(--border); margin-bottom: 32px; }
.eyebrow { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 10px; }
.page-head p { margin-top: 9px; color: var(--fg-muted); line-height: 1.6; }
.vignette { margin: 0 0 40px; }
figcaption { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
figcaption .number { color: var(--fg-muted); font: 11px var(--font-mono); }
figcaption .dimension { margin-left: auto; color: var(--fg-muted); font-size: 11px; }
.frame { border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--bg); overflow: hidden; }
.small { font-size: 12px; }
.label { font-size: 10px; text-transform: uppercase; letter-spacing: .075em; color: var(--fg-muted); font-weight: 600; }
.row { display: flex; align-items: center; gap: 8px; }
.between { justify-content: space-between; }
.glyph { width: 26px; height: 26px; display: inline-grid; place-items: center; background: var(--bg-active); border: 1px solid var(--border-strong); border-radius: 7px; flex: 0 0 auto; font-size: 18px; }
.pending { color: var(--warning); font-size: 11px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.pending::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.btn { border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 7px 13px; background: var(--bg-hover); font-weight: 500; }
.btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 650; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.compact { padding: 5px 10px; font-size: 12px; }
.hint { font-size: 11px; color: var(--fg-muted); }
.popover { background: var(--bg-overlay); border: 1px solid var(--border-strong); border-radius: var(--radius); box-shadow: 0 8px 28px color-mix(in srgb, var(--bg) 70%, transparent); }
.codebox { font: 12px/1.7 var(--font-mono); background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; overflow: auto; max-height: 160px; white-space: pre-wrap; overflow-wrap: anywhere; }
.cwd { font-size: 11px; color: var(--fg-muted); overflow-wrap: anywhere; line-height: 1.6; }
.cwd code { font: 11px var(--font-mono); }
.divider { border-top: 1px solid var(--border); }
/* 01 — the sidebar remains 300px; its hover card extends into the main pane. */
.attention-frame { position: relative; min-height: 422px; display: flex; }
.sidebar { width: 300px; min-width: 300px; min-height: 420px; background: var(--bg-raised); border-right: 1px solid var(--border); padding: 14px 10px; }
.search { display: flex; gap: 8px; align-items: center; border: 1px solid var(--border-strong); border-radius: 6px; padding: 6px 8px; margin: 0 4px 22px; color: var(--fg-muted); }
.search svg { width: 14px; height: 14px; flex-shrink: 0; }
.search input { width: 100%; min-width: 0; background: transparent; border: 0; color: var(--fg); outline: 0; font-size: 12px; }
.search input::placeholder { color: var(--fg-muted); }
.search:focus-within { outline: 2px solid var(--accent); }
.search kbd { font: 10px var(--font-ui); white-space: nowrap; }
.section-heading { padding: 0 9px; margin: 0 0 9px; display: flex; justify-content: space-between; }
.section-heading.attention { color: var(--warning); }
.session-row { width: 100%; text-align: left; padding: 9px; border-radius: var(--radius-sm); display: block; margin-bottom: 3px; }
.session-row.hovered { background: var(--bg-active); box-shadow: inset 2px 0 var(--warning); }
.session-title { display: block; font-size: 12px; white-space: nowrap; margin-bottom: 6px; }
.session-meta { display: flex; align-items: center; justify-content: space-between; color: var(--fg-muted); font-size: 11px; }
.reason { padding: 2px 6px; border-radius: 4px; background: var(--bg-hover); color: var(--fg-muted); }
.reason.approval { color: var(--warning); background: color-mix(in srgb, var(--warning) 10%, transparent); }
.reason.plan { color: var(--info); }
.sidebar-section { margin-top: 21px; }
.sidebar-context { color: var(--fg-muted); padding: 4px 9px; line-height: 24px; font-size: 12px; }
.quick { align-self: flex-start; margin: 76px 14px 16px 10px; width: 422px; min-width: 20rem; position: relative; padding: 16px; }
.quick::before { content: ''; position: absolute; width: 8px; height: 8px; background: var(--bg-overlay); border-left: 1px solid var(--border-strong); border-bottom: 1px solid var(--border-strong); transform: rotate(45deg); left: -5px; top: 29px; }
.quick .agent-line { margin: 15px 0 10px; color: var(--fg-muted); font-size: 12px; }
.quick .cwd { margin-top: 7px; }
.suggestion { font-size: 12px; margin: 13px 0 16px; line-height: 1.6; color: var(--fg-muted); }
.suggestion code { color: var(--fg); font-size: 11px; }
.quick .actions a { margin-left: auto; font-size: 12px; }
.quick .hint { margin-top: 13px; }
/* 02 + 03 — one composer locus, occupied by the permission request. */
.main-crop { padding: 22px 24px 0; }
.assistant-line { margin: 3px 0 28px; }
.locus-label { display: flex; justify-content: space-between; margin: 0 2px 8px; color: var(--fg-muted); font-size: 11px; }
.permission { border: 1px solid var(--border-strong); border-top: 2px solid var(--warning); border-radius: var(--radius); background: var(--bg-raised); }
.permission-content { padding: 16px; }
.permission-header { margin-bottom: 15px; }
.permission-header .pending { margin-left: auto; }
.command-summary { padding: 0; position: relative; }
.command-summary summary { list-style: none; cursor: pointer; padding: 10px 82px 10px 12px; }
.command-summary summary::-webkit-details-marker { display: none; }
.command-summary summary::after { content: 'Expand ⤢'; position: absolute; right: 12px; top: 12px; font: 11px var(--font-ui); color: var(--fg-muted); }
.command-summary[open] summary::after { content: 'Collapse'; }
.command-summary pre { font: inherit; border-top: 1px solid var(--border); padding: 10px 12px; margin: 0; white-space: pre-wrap; }
.permission .cwd { margin: 8px 0 10px; }
.why { font-size: 12px; }
.why span { color: var(--fg-muted); }
fieldset { border: 0; padding: 0; margin: 16px 0 0; min-width: 0; }
legend { font-size: 11px; color: var(--fg-muted); margin-bottom: 7px; }
.scope { display: flex; gap: 9px; align-items: center; min-height: 32px; padding: 5px 8px; border-radius: 5px; font-size: 12px; cursor: pointer; }
.scope:has(input:checked) { background: var(--accent-soft); }
.scope input { margin: 0; }
.scope .scope-note { margin-left: auto; font-size: 11px; color: var(--fg-muted); }
.deny-reason { margin: 8px 8px 0; font-size: 12px; }
.deny-reason summary { color: var(--fg-muted); cursor: pointer; width: fit-content; }
.deny-reason textarea { width: 100%; min-height: 55px; margin-top: 10px; background: var(--bg); color: var(--fg); border: 1px solid var(--border-strong); border-radius: 6px; padding: 8px; resize: vertical; }
.permission-footer { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
.permission-footer .hint { margin-left: auto; }
.statusline { display: flex; align-items: center; gap: 5px; min-height: 38px; color: var(--fg-muted); font-size: 11px; white-space: nowrap; }
.statusline button { color: inherit; font-size: inherit; padding: 4px 2px; border-radius: 4px; }
.statusline button:hover,.statusline .hovered { background: var(--bg-active); color: var(--fg); }
.statusline .path { margin-right: auto; font-size: 11px; }
.files { border: 1px solid var(--border); background: var(--bg); border-radius: 6px; }
.file { padding: 11px 12px; }
.file+.file { border-top: 1px solid var(--border); }
.file code { font: 12px var(--font-mono); }
.file .counts { margin-left: auto; font: 11px var(--font-mono); }
.add { color: var(--success); }
.remove { color: var(--danger); }
.file .diff-link { padding-left: 22px; margin-top: 7px; font-size: 11px; color: var(--fg-muted); }
.file .diff-link a { text-decoration: underline; text-underline-offset: 3px; }
/* 04 — two related widgets, held open side by side. */
.palette-crop { padding: 18px 18px 0; }
.widget-pair { display: grid; grid-template-columns: minmax(0,1.18fr) minmax(0,1fr); gap: 14px; align-items: end; }
.palette { overflow: hidden; }
.palette-search { padding: 13px 12px; border-bottom: 1px solid var(--border); }
.palette-search code { margin-left: 8px; font-size: 12px; }
.palette-search .muted:last-child { margin-left: auto; font-size: 10px; }
.group-label { padding: 13px 12px 6px; font-size: 10px; font-weight: 600; color: var(--fg-muted); text-transform: uppercase; letter-spacing: .07em; }
.command { margin: 2px 6px; padding: 8px; border-radius: 5px; display: flex; gap: 7px; align-items: flex-start; width: calc(100% - 12px); text-align: left; }
.command.active { background: var(--accent-soft); }
.command code { font: 12px var(--font-mono); }
.command .description { display: block; font-size: 11px; color: var(--fg-muted); margin-top: 4px; }
.badge { margin-left: auto; font-size: 9px; color: var(--fg-muted); border: 1px solid var(--border-strong); padding: 2px 4px; border-radius: 4px; white-space: nowrap; }
.active .badge { color: var(--fg); }
.palette-footer { margin-top: 10px; padding: 10px 12px; border-top: 1px solid var(--border); }
.widget-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 12px; border-bottom: 1px solid var(--border); }
.widget-head code { color: var(--fg-muted); font: 11px var(--font-mono); }
.model-option { position: relative; padding: 7px 10px; display: flex; gap: 8px; margin: 1px 6px; cursor: pointer; border-radius: 5px; align-items: center; }
.model-option:has(input:checked) { background: var(--accent-soft); }
.model-option input { position: absolute; opacity: 0; }
.model-option:has(input:focus-visible) { outline: 2px solid var(--accent); }
.model-check { width: 12px; color: transparent; }
.model-option:has(input:checked) .model-check { color: var(--accent); }
.model-option small { margin-left: auto; color: var(--fg-muted); font-size: 10px; }
.model-text { font-size: 12px; }
.gateway-caption { display: block; color: var(--fg-muted); font-size: 10px; margin-top: 3px; }
.model-options { margin: 0; }
.model-bottom { padding: 12px; border-top: 1px solid var(--border); margin-top: 9px; }
.effort { display: flex; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--bg); padding: 3px; margin: 8px 0 12px; }
.effort label { width: 25%; text-align: center; padding: 5px 0; font-size: 11px; border-radius: 4px; cursor: pointer; }
.effort input { position: absolute; opacity: 0; }
.effort label:has(input:checked) { background: var(--bg-active); color: var(--fg); box-shadow: inset 0 0 0 1px var(--border-strong); }
.effort label:has(input:focus-visible) { outline: 2px solid var(--accent); }
.switch { position: relative; width: 26px; height: 16px; display: inline-block; }
.switch input { width: 100%; height: 100%; margin: 0; opacity: 0; position: absolute; z-index: 1; cursor: pointer; }
.switch span { display: block; height: 16px; border-radius: 10px; background: var(--bg-active); border: 1px solid var(--border-strong); }
.switch span::before { content: ''; display: block; width: 10px; height: 10px; margin: 2px; background: var(--fg-muted); border-radius: 50%; transition: transform .15s; }
.switch input:checked+span { background: var(--accent); }
.switch input:checked+span::before { transform: translateX(10px); background: var(--bg); }
.switch input:focus-visible+span { outline: 2px solid var(--accent); outline-offset: 3px; }
.composer { background: var(--bg-raised); border: 1px solid var(--border-strong); border-radius: var(--radius); margin-top: 12px; padding: 12px; }
.context-strip { gap: 12px; font-size: 11px; color: var(--fg-muted); margin-bottom: 12px; }
.composer textarea { width: 100%; height: 42px; resize: none; background: transparent; border: 0; color: var(--fg); padding: 0; font-size: 13px; }
.composer textarea::placeholder { color: var(--fg-muted); }
.composer-bottom { color: var(--fg-muted); }
.composer-bottom button { color: var(--fg-muted); border-radius: 5px; padding: 2px 5px; }
.send { margin-left: auto; background: var(--bg-active); }
/* 05 — usage uses one magnitude ink; context uses order + texture + labels. */
.status-crop { padding: 20px 18px 0; }
.status-popovers { display: grid; grid-template-columns: 1.2fr 1fr; align-items: end; gap: 14px; }
.usage-body,.context-body { padding: 14px; }
.account { margin-top: 5px; color: var(--fg-muted); font-size: 12px; }
.meter-block { margin-top: 18px; }
.meter-label { font-size: 12px; display: flex; justify-content: space-between; }
.meter-label .muted { font-size: 11px; }
.meter { height: 5px; border-radius: 3px; background: var(--bg-active); overflow: hidden; margin-top: 8px; }
.meter span { display: block; height: 100%; background: var(--fg-muted); border-radius: 0 3px 3px 0; }
.forecast { display: flex; gap: 8px; margin-top: 17px; font-size: 12px; line-height: 1.55; }
.forecast .g-needs { font-size: 14px; }
.other-accounts { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
.other-accounts details { margin-top: 10px; color: var(--fg-muted); font-size: 12px; }
.other-accounts summary { cursor: pointer; }
.other-accounts p { margin-top: 8px; line-height: 1.6; }
.popover-footer { border-top: 1px solid var(--border); padding: 11px 14px; font-size: 12px; display: flex; justify-content: space-between; }
.context-body .total { margin-top: 14px; font-size: 12px; }
.context-body .threshold { margin-top: 5px; font-size: 11px; color: var(--fg-muted); }
.context-stack { margin: 15px 0; height: 9px; display: flex; gap: 0; background: var(--bg); border-radius: 3px; overflow: hidden; position: relative; }
.context-stack::after { content: ''; position: absolute; width: 1px; height: 100%; left: 85%; background: var(--fg-muted); }
.context-stack span { background: var(--fg-muted); flex-shrink: 0; border-right: 2px solid var(--bg); }
.context-stack .tools,.swatch.tools { background: repeating-linear-gradient(90deg,var(--fg-muted) 0 2px,var(--bg-overlay) 2px 4px); }
.context-stack .attachments,.swatch.attachments { background: repeating-linear-gradient(45deg,var(--fg-muted) 0 1px,var(--bg-overlay) 1px 3px); }
.context-stack .system,.swatch.system { background: var(--fg); }
.context-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.context-table td { padding: 5px 0; }
.context-table td:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--fg-muted); }
.swatch { display: inline-block; width: 7px; height: 7px; background: var(--fg-muted); margin-right: 7px; }
.context-body .btn { margin-top: 14px; }
.page-foot { color: var(--fg-muted); font-size: 11px; padding-top: 8px; }
@media (max-width: 700px) {
 body { padding: 24px 14px 40px; }
 .dimension { display: none; }
 .attention-frame { display: block; }
 .sidebar { width: 300px; min-height: 420px; border-bottom: 1px solid var(--border); }
 .quick { margin: 12px; width: calc(100% - 24px); min-width: 0; }
 .quick::before { display: none; }
 .main-crop { padding: 18px 12px 0; }
 .permission-header { flex-wrap: wrap; }
 .permission-header .pending { width: 100%; margin-left: 34px; }
 .permission-footer { flex-wrap: wrap; }
 .permission-footer .hint { width: 100%; margin: 5px 0 0; }
 .scope .scope-note { display: none; }
 .widget-pair,.status-popovers { grid-template-columns: 1fr; }
 .palette-crop,.status-crop { padding: 12px 12px 0; }
 .statusline { flex-wrap: wrap; white-space: normal; padding: 8px 0; row-gap: 2px; }
 .statusline .path { flex-basis: 100%; }
 .file code { font-size: 10px; overflow-wrap: anywhere; }
 .file .counts { white-space: nowrap; }
 .context-strip { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
<header class="page-head">
 <div class="eyebrow">MAWS / Interaction studies / 04</div>
 <h1>Attention, without losing your place.</h1>
 <p>Decisions at the composer. Quick actions across projects. Detail one layer away.</p>
</header>

<figure class="vignette" id="quick-approve">
 <figcaption><span class="number">01</span><h2>Needs-you quick approve</h2><span class="dimension">300 px sidebar · hover state</span></figcaption>
 <div class="frame attention-frame">
  <aside class="sidebar" aria-label="Session sidebar">
   <label class="search"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="m12 12 5 5"/></svg><input type="search" aria-label="Search sessions" placeholder="Search sessions"><kbd>⌘ K</kbd></label>
   <div class="section-heading attention label">Needs you · 3 <span>⌘ ⇧ J</span></div>
   <button class="session-row hovered" aria-describedby="quick-request"><span class="session-title">MAWS · Fix sidebar drag</span><span class="session-meta"><span class="reason approval">approval</span><span>2m</span></span></button>
   <button class="session-row"><span class="session-title">codex_somersault · Quota reset recovery</span><span class="session-meta"><span class="reason">question</span><span>6m</span></span></button>
   <button class="session-row"><span class="session-title">MAWS · Rename project</span><span class="session-meta"><span class="reason plan">plan review</span><span>11m</span></span></button>
   <div class="sidebar-section"><div class="section-heading label">Pinned <span>2</span></div><div class="sidebar-context">◇ &nbsp; Engine adapter spike</div></div>
   <div class="sidebar-section"><div class="section-heading label">Projects <span>+</span></div><div class="sidebar-context">⌄ &nbsp; MAWS <span style="float:right">4 sessions</span></div></div>
  </aside>
  <section class="popover quick" id="quick-request" aria-label="Approval preview">
   <div class="row between"><h3>Fix sidebar drag</h3><span class="pending">Waiting 2m</span></div>
   <div class="row agent-line"><span class="glyph" aria-hidden="true">✳</span> Main session wants to run</div>
   <div class="codebox">git push origin feat/sidebar-drag</div>
   <div class="cwd">cwd <code>~/Developer/GitHub/MAWS</code></div>
   <p class="suggestion">Suggested: allow <code>git push</code> for this project</p>
   <div class="row actions"><button class="btn primary" title="Static preview — allow this request once">Approve</button><button class="btn">Deny</button><a href="#command-approval">Open session ↗</a></div>
   <div class="hint">Enter approve · Esc deny <span style="float:right">This request only</span></div>
  </section>
 </div>
</figure>

<figure class="vignette" id="command-approval">
 <figcaption><span class="number">02</span><h2>Approval docked at the composer</h2><span class="dimension">760 px main column</span></figcaption>
 <div class="frame main-crop">
  <p class="prose assistant-line">Pushing the branch so the PR can be opened.</p>
  <div class="locus-label"><span>Approval required</span><span>Composer paused · draft preserved</span></div>
  <section class="permission" aria-label="Command permission request">
   <div class="permission-content">
    <div class="row permission-header"><span class="glyph" aria-hidden="true">✳</span><h3>Main session wants to run a command</h3><span class="pending">Needs you</span></div>
    <details class="codebox command-summary"><summary>git push origin feat/sidebar-drag</summary><pre>{
  "command": "git push origin feat/sidebar-drag",
  "description": "Push the sidebar fix branch to origin"
}</pre></details>
    <div class="cwd">cwd <code>~/Developer/GitHub/MAWS</code></div>
    <p class="why"><span>Why:</span> opening PR for the sidebar fix</p>
    <fieldset><legend>Grant scope</legend>
     <label class="scope"><input type="radio" name="command-scope" checked>Allow once<span class="scope-note">Only this invocation</span></label>
     <label class="scope"><input type="radio" name="command-scope">Allow for this session<span class="scope-note">Matching git push commands</span></label>
     <label class="scope"><input type="radio" name="command-scope">Always allow “git push” in MAWS<span class="scope-note">Project rule</span></label>
    </fieldset>
    <details class="deny-reason"><summary>Deny… <span class="hint">with an optional reason</span></summary><label for="deny-feedback" class="small muted">Feedback to the agent</label><textarea id="deny-feedback" placeholder="Keep this branch local for now."></textarea></details>
   </div>
   <div class="permission-footer"><button class="btn primary">Allow</button><button class="btn">Deny</button><span class="hint">Enter · Esc · Tab changes scope</span></div>
  </section>
  <div class="statusline" aria-label="Session status"><span class="path">~/Developer/GitHub/MAWS</span><span>·</span><button>ctx 41% of 1M</button><span>·</span><button>5h 74% ↻2h37m</button><span>·</span><button>7d 82% ↻5d21h</button><span>·</span><button>$3.41</button><span>·</span><button>auto</button></div>
 </div>
</figure>

<figure class="vignette" id="edit-approval">
 <figcaption><span class="number">03</span><h2>Edit approval variant</h2><span class="dimension">760 px main column</span></figcaption>
 <div class="frame main-crop">
  <p class="prose assistant-line">I’ll update the drop target and cover the cross-pane drag case.</p>
  <div class="locus-label"><span>Approval required</span><span>Composer paused · draft preserved</span></div>
  <section class="permission" aria-label="Edit permission request">
   <div class="permission-content">
