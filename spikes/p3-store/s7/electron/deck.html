<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'self'" />
    <title>S7b deck replica</title>
    <style>
      body { margin: 0; font: 14px -apple-system, sans-serif; display: flex; height: 100vh; overflow: hidden; background: #f5f5f4; }
      #strip { width: 220px; overflow-y: auto; padding: 8px; box-sizing: border-box; }
      .thumb { width: 192px; height: 108px; overflow: hidden; position: relative; margin: 0 0 8px; background: #fff; outline: 1px solid #e5e5e5; }
      .thumb > .scale { transform: scale(0.1); transform-origin: 0 0; width: 1920px; height: 1080px; }
      #stage { flex: 1; position: relative; overflow: hidden; }
      #stage > .scale { transform: scale(0.5); transform-origin: 0 0; width: 1920px; height: 1080px; position: absolute; left: 24px; top: 24px; }
    </style>
  </head>
  <body>
    <div id="strip"></div>
    <div id="stage"></div>
    <script src="deck.js"></script>
  </body>
</html>
