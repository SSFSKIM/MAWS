<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>S7b editor replica</title>
    <style>
      body { font: 16px/1.55 -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; background: #fff; color: #1a1a1a; }
      #editor { max-width: 760px; margin: 0 auto; padding: 48px 32px; }
      .ProseMirror { outline: none; white-space: pre-wrap; }
      .ProseMirror h2 { font-size: 24px; margin: 28px 0 8px; } .ProseMirror h3 { font-size: 18px; margin: 20px 0 6px; }
      .ProseMirror p { margin: 0 0 10px; } .ProseMirror pre { background: #f5f5f4; padding: 12px; border-radius: 6px; font: 13px/1.5 ui-monospace, monospace; }
      .ProseMirror table { border-collapse: collapse; width: 100%; margin: 12px 0; } .ProseMirror td, .ProseMirror th { border: 1px solid #e5e5e5; padding: 4px 8px; }
      .ProseMirror blockquote { border-left: 3px solid #d4d4d4; margin: 12px 0; padding-left: 12px; color: #525252; }
      .ProseMirror aside[data-callout] { background: #eff6ff; padding: 8px 12px; border-radius: 6px; }
      .ProseMirror span[data-thread] { background: #fef3c7; }
      .ProseMirror ul[data-type="taskList"] { list-style: none; padding-left: 4px; }
      y-ins { background: #dcfce7; text-decoration: none; } y-del { background: #fee2e2; text-decoration: line-through; } y-fmt { outline: 1px dotted #a3a3a3; }
      .ProseMirror-yjs-cursor { position: relative; border-left: 2px solid #c2410c; margin-left: -1px; margin-right: -1px; }
    </style>
  </head>
  <body>
    <script src="editor.js"></script>
  </body>
</html>
